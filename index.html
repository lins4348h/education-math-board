<body>
<div class="wrap" id="app"></div>
<script>
// 拖移解題板引擎（純邏輯，沒有 DOM；瀏覽器與 node 測試共用）。老師與 Agent 都不要修改這個檔案。
// 內容包放在 packs/，每個檔案呼叫 SB.register(pack)。格式見 docs/pack-format.md。
//   拖的是解題過程不是答案、誘答卡對準誤解、三層提示、完成一步才得分、每一步留痕。
(function (root) {
  // ---------- 亂數與格式 ----------
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = (rng, lo, hi) => lo + Math.floor(rng() * (hi - lo + 1));
  const pick = (rng, a) => a[Math.floor(rng() * a.length)];
  const nz = (rng, lo, hi) => { for (;;) { const v = rnd(rng, lo, hi); if (v) return v; } };
  function shuffle(rng, arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }
  const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a; };

  const num = (n) => (n < 0 ? `−${-n}` : `${n}`);
  const sg = (n) => (n < 0 ? `−${-n}` : `+${n}`);
  const pn = (n) => (n < 0 ? `(−${-n})` : `${n}`);
  const op = (n) => (n < 0 ? `− ${-n}` : `+ ${n}`);
  function term(c, v, signed) {
    if (!v) return signed ? sg(c) : num(c);
    const a = Math.abs(c);
    return (c < 0 ? '−' : signed ? '+' : '') + (a === 1 ? '' : a) + v;
  }
  function lin(parts) {
    let out = '';
    for (const [c, v] of parts) {
      if (!c) continue;
      const a = Math.abs(c);
      const t = v ? (a === 1 ? '' : a) + v : String(a);
      out += out ? ` ${c < 0 ? '−' : '+'} ${t}` : (c < 0 ? '−' : '') + t;
    }
    return out || '0';
  }
  const eqXY = (a, b, c) => `${lin([[a, 'x'], [b, 'y']])} = ${num(c)}`;
  const fracText = (n, d) => `${n * d < 0 ? '−' : ''}[frac:${Math.abs(n)}|${Math.abs(d)}]`;

  // ---------- 引擎 ----------
  function walk(line, visit) {
    for (const t of line || []) {
      if (t && typeof t === 'object' && t.frac) { walk(t.frac[0], visit); walk(t.frac[1], visit); }
      else visit(t);
    }
  }
  function slotIds(step) {
    const ids = [];
    walk(step.line, (t) => { if (t && typeof t === 'object' && t.slot) ids.push(t.slot); });
    return ids;
  }

  // spec.cards 可含 false（條件不成立的誘答），會被濾掉；引用不存在卡片的診斷規則也一併濾掉。
  // 回傳 null 表示卡片文字重複（呼叫端重新出題）。
  function buildStep(spec, rng) {
    const cards = spec.cards.filter(Boolean);
    const texts = cards.map((c) => c.text);
    if (new Set(texts).size !== texts.length) return null;
    const keys = new Set(cards.map((c) => c.key));
    const has = (k) => [].concat(k).every((x) => keys.has(x));
    const order = shuffle(rng, cards);
    const idOf = new Map(order.map((c, i) => [c.key, `c${i + 1}`]));
    const map = (k) => (Array.isArray(k) ? k.map(map) : idOf.get(k));
    const mapObj = (o) => Object.fromEntries(Object.entries(o).map(([s, k]) => [s, map(k)]));
    const diagnose = (spec.diagnose || []).filter(Boolean).filter((r) => Object.values(r.when).every(has));
    if (!spec.accept.every((a) => Object.values(a).every(has))) return null;
    return {
      key: spec.key, goal: spec.goal, scaffold: spec.scaffold || '', line: spec.line, hints: spec.hints, fallback: spec.fallback,
      cards: order.map(({ key, ...c }) => ({ id: idOf.get(key), ...c })),
      accept: spec.accept.map(mapObj),
      diagnose: diagnose.map((r) => ({ ...r, when: mapObj(r.when) })),
    };
  }

  function checkStep(step, pl) {
    const ids = slotIds(step);
    const missing = ids.filter((s) => !pl[s]);
    if (missing.length) return { ok: false, kind: 'incomplete', fb: '還有空格沒有放卡片。', wrong: missing };
    let best = null;
    for (const a of step.accept) {
      const w = ids.filter((s) => a[s] !== pl[s]);
      if (!best || w.length < best.length) best = w;
    }
    if (!best.length) return { ok: true, kind: 'ok', fb: '', wrong: [] };
    for (const r of step.diagnose) {
      if (Object.entries(r.when).every(([s, w]) => [].concat(w).includes(pl[s]))) {
        return { ok: false, kind: r.kind, fb: r.fb, wrong: r.slots || Object.keys(r.when) };
      }
    }
    return { ok: false, kind: 'other', fb: step.fallback || '對照上一行，再檢查紅框的格子。', wrong: best };
  }

  function revealHint(step, pl) {
    const a = step.accept[0];
    for (const s of slotIds(step)) if (pl[s] !== a[s]) return { slot: s, card: a[s] };
    return null;
  }

  const SCORING = { base: 10, hint: [0, 2, 4, 6], err: 1, errCap: 3, min: 3, clean: 5 };
  function stepScore(errors, hintLevel) {
    return Math.max(SCORING.min, SCORING.base - SCORING.hint[Math.min(hintLevel, 3)] - Math.min(errors * SCORING.err, SCORING.errCap));
  }

  function makeWith(name, tryMake) {
    return (rng = Math.random) => {
      for (let i = 0; i < 3000; i++) {
        const p = tryMake(rng);
        if (p && p.steps.every(Boolean)) return p;
      }
      throw new Error(`${name}：產生題目失敗`);
    };
  }

  // ---------- 共用步驟：x = n/d = r（整數解） ----------
  function divideStep(rng, { A, K, x, wrongCoef, label }) {
    return buildStep({
      key: 'divide',
      goal: '係數化為 1：兩邊同除以 x 的係數',
      line: ['x =', { frac: [[{ slot: 'n' }], [{ slot: 'd' }]] }, '=', { slot: 'r' }],
      cards: [
        { key: 'nK', text: num(K) },
        { key: 'dA', text: num(A) },
        wrongCoef !== undefined && wrongCoef !== A && { key: 'wa', text: num(wrongCoef), trap: 'divide_wrong_object' },
        { key: 'r', text: num(x) },
        { key: 'rn', text: num(-x), trap: 'sign_error' },
        Math.abs(x) > 1 && { key: 'ri', text: fracText(1, x), trap: 'frac_inverted' },
      ],
      accept: [{ n: 'nK', d: 'dA', r: 'r' }],
      diagnose: [
        { when: { n: 'dA', d: 'nK' }, kind: 'frac_inverted', fb: `${term(A, 'x')} = ${num(K)}，x ＝ 常數 ÷ 係數：${num(K)} 放分子、${num(A)} 放分母。` },
        { when: { d: 'wa' }, kind: 'divide_wrong_object', fb: `要除以合併後的係數 ${num(A)}，${label || '不是原本的係數'}。` },
        { when: { n: 'wa' }, kind: 'divide_wrong_object', fb: `分子是合併後的常數 ${num(K)}。` },
        { when: { r: 'rn' }, kind: 'sign_error', fb: `檢查正負號：${num(K)} ÷ ${pn(A)} 是${x > 0 ? '正' : '負'}數。` },
        { when: { r: 'ri' }, kind: 'frac_inverted', fb: '最後結果要等於左邊的分數，分子、分母不能對調。' },
      ],
      hints: ['兩邊同除以 x 的係數，x 的係數就變成 1。', `x ＝ ${num(K)} ÷ ${pn(A)}，分子放 ${num(K)}。`, `分母放 ${num(A)}，${num(K)} ÷ ${pn(A)} = ${num(x)}。`],
    }, rng);
  }

  // ---------- 內容包登記 ----------
  const PACKS = [];
  function register(pack) {
    for (const k of ['id', 'grade', 'title', 'unit', 'pitch', 'kinds', 'stepLabels', 'make']) {
      if (!pack[k]) throw new Error(`內容包缺少欄位 ${k}`);
    }
    if (!/^[a-z0-9-]{2,30}$/.test(pack.id)) throw new Error(`內容包 id 只能用小寫英文、數字、連字號：${pack.id}`);
    if (PACKS.some((p) => p.id === pack.id)) throw new Error(`內容包 id 重複：${pack.id}`);
    PACKS.push(pack);
  }

  // 內容包可用的工具
  const tools = { buildStep, makeWith, divideStep, rnd, pick, nz, shuffle, gcd, num, sg, pn, op, term, lin, eqXY, fracText };
  const api = { mulberry32, slotIds, checkStep, revealHint, stepScore, SCORING, PACKS, register, tools, walk };
  root.SB = api;
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

// ---- packs/01-paren.js ----
// 內容包：去括號解一元一次方程式 a(x + b) = cx + d
// 格式說明見 docs/pack-format.md；誘答卡、診斷規則、三層提示的寫法可以照這個檔案仿寫。
(function () {
  const { buildStep, makeWith, divideStep, rnd, pick, nz, gcd, num, sg, pn, op, term, lin, eqXY, fracText } = SB.tools;

  const paren = {
    id: 'paren', grade: '七上', title: '去括號解方程式', unit: '一元一次方程式（分配律、移項、合併）',
    pitch: '先用分配律去括號，再移項、合併、係數化為 1。括號前是負數時最容易出錯。',
    kinds: {
      dist_first_only: '分配律只乘到第一項', dist_sign: '分配時正負號錯', sign_not_flipped: '移項沒有變號',
      unlike_terms: 'x 項與常數放錯邊', combine_error: '合併同類項算錯', divide_wrong_object: '除以錯的數',
      frac_inverted: '分子分母顛倒', sign_error: '答案正負號錯',
    },
    stepLabels: { expand: '去括號', move: '移項', combine: '合併同類項', divide: '係數化為 1' },
    make: makeWith('paren', (rng) => {
      const a = pick(rng, [-5, -4, -3, -2, 2, 3, 4, 5]);
      const b = nz(rng, -6, 6);
      const c = nz(rng, -6, 6);
      const A = a - c;
      if (!A || Math.abs(A) > 9) return null;
      const x = pick(rng, [-6, -5, -4, -3, -2, 2, 3, 4, 5, 6]);
      const ab = a * b, d = A * x + ab, K = d - ab;
      if (!d || Math.abs(d) > 40) return null;
      const rhs = lin([[c, 'x'], [d, '']]);
      const stem = `${num(a)}(x ${op(b)}) = ${rhs}`;
      const s1 = buildStep({
        key: 'expand', goal: '去括號：括號外的數，要乘進括號裡的每一項',
        line: [{ slot: 'p' }, { slot: 'q' }, '=', rhs],
        cards: [
          { key: 'px', text: term(a, 'x') },
          { key: 'qk', text: sg(ab) },
          { key: 't1', text: sg(b), trap: 'dist_first_only' },
          { key: 't2', text: sg(-ab), trap: 'dist_sign' },
          { key: 't3', text: term(-a, 'x'), trap: 'dist_sign' },
        ],
        accept: [{ p: 'px', q: 'qk' }],
        diagnose: [
          { when: { q: 't1' }, kind: 'dist_first_only', fb: `括號外的 ${num(a)} 要乘進每一項：${pn(a)} × ${pn(b)} = ${num(ab)}，不能只乘 x。` },
          { when: { q: 't2' }, kind: 'dist_sign', fb: `${pn(a)} × ${pn(b)} 要連同正負號一起算，等於 ${num(ab)}。` },
          { when: { p: 't3' }, kind: 'dist_sign', fb: `${pn(a)} × x = ${term(a, 'x')}，括號外的正負號也要乘進去。` },
        ],
        hints: ['括號外的數要乘進括號裡的「每一項」。', `${num(a)}(x ${op(b)}) = ${pn(a)} × x + ${pn(a)} × ${pn(b)}`, `第一項是 ${term(a, 'x')}。`],
      }, rng);
      const s2 = buildStep({
        key: 'move', goal: '移項：x 項移到左邊、常數移到右邊，移過去要變號',
        line: [term(a, 'x'), { slot: 'm' }, '=', num(d), { slot: 'n' }],
        cards: [
          { key: 'mx', text: term(-c, 'x', true) },
          { key: 'px', text: term(c, 'x', true), trap: 'sign_not_flipped' },
          { key: 'mn', text: sg(-ab) },
          { key: 'pk', text: sg(ab), trap: 'sign_not_flipped' },
        ],
        accept: [{ m: 'mx', n: 'mn' }],
        diagnose: [
          { when: { m: ['mn', 'pk'] }, kind: 'unlike_terms', fb: `左邊這格要放「含 x 的項」：是右邊的 ${term(c, 'x')} 要搬過來。` },
          { when: { n: ['mx', 'px'] }, kind: 'unlike_terms', fb: `右邊這格要放常數：是左邊的 ${sg(ab)} 要搬過去。` },
          { when: { m: 'px' }, kind: 'sign_not_flipped', fb: `右邊的 ${term(c, 'x')} 移到左邊要變號，變成 ${term(-c, 'x', true)}。` },
          { when: { n: 'pk' }, kind: 'sign_not_flipped', fb: `左邊的 ${sg(ab)} 移到右邊要變號，變成 ${sg(-ab)}。` },
        ],
        hints: ['含 x 的項都到左邊，常數都到右邊。', '移項就是兩邊同時加或減同一個量，所以搬過去要變號。', `右邊的 ${term(c, 'x')} 搬到左邊會變成 ${term(-c, 'x', true)}。`],
      }, rng);
      const s3 = buildStep({
        key: 'combine', goal: '合併同類項：左邊合成一個 x 項，右邊合成一個數',
        line: [{ slot: 'l' }, '=', { slot: 'r' }],
        cards: [
          { key: 'cl', text: term(A, 'x') },
          { key: 'kr', text: num(K) },
          a + c !== 0 && { key: 'tw', text: term(a + c, 'x'), trap: 'combine_error' },
          { key: 'kw', text: num(d + ab), trap: 'combine_error' },
        ],
        accept: [{ l: 'cl', r: 'kr' }],
        diagnose: [
          { when: { l: 'tw' }, kind: 'combine_error', fb: `x 的係數要連同正負號算：${num(a)} ${op(-c)} = ${num(A)}。` },
          { when: { r: 'kw' }, kind: 'combine_error', fb: `常數要連同正負號算：${num(d)} ${op(-ab)} = ${num(K)}。` },
        ],
        hints: ['左邊兩個 x 項合併，右邊兩個數合併。', `x 的係數：${num(a)} ${op(-c)}；常數：${num(d)} ${op(-ab)}。`, `左邊合併後是 ${term(A, 'x')}。`],
      }, rng);
      const s4 = divideStep(rng, { A, K, x, wrongCoef: a, label: `不是括號外的 ${num(a)}` });
      return { stem: [stem], params: { a, b, c, d }, answer: { x }, answerText: `x = ${num(x)}`, steps: [s1, s2, s3, s4] };
    }),
  };

  SB.register(paren);
})();

// ---- packs/02-word1.js ----
// 內容包：一元一次應用題（買東西、年齡、剪緞帶三種題型）
// 格式說明見 docs/pack-format.md；誘答卡、診斷規則、三層提示的寫法可以照這個檔案仿寫。
(function () {
  const { buildStep, makeWith, divideStep, rnd, pick, nz, gcd, num, sg, pn, op, term, lin, eqXY, fracText } = SB.tools;

  function wordBuy(rng) {
    const n = rnd(rng, 3, 8), x = rnd(rng, 8, 30), p = rnd(rng, 4, 16) * 5, T = n * x + p;
    return {
      story: `小安買了 ${n} 枝原子筆和 1 本 ${p} 元的筆記本，共付了 ${T} 元。每枝原子筆多少元？`,
      params: { t: 'buy', n, x, p, T }, x,
      define: { ok: '每枝原子筆 x 元', traps: [['總共 x 元', `總共 ${T} 元是已知的，要把「題目問的量」設成 x。`], ['筆記本 x 元', `筆記本 ${p} 元是已知的，題目問的是原子筆。`]] },
      eq: {
        L: `${n}x + ${p}`, R: `${T}`,
        traps: [
          [`x + ${p}`, 'miss_multiplier', `買了 ${n} 枝，原子筆的錢是 ${n} × x = ${n}x。`],
          [`${n}(x + ${p})`, 'wrong_grouping', `${n}(x + ${p}) 表示買了 ${n} 組「筆＋筆記本」，但筆記本只買 1 本。`],
        ],
      },
      simp: {
        accept: [[term(n, 'x'), num(T - p)]],
        traps: [[num(T + p), 'sign_not_flipped', `把 +${p} 移到右邊要變號：${T} − ${p} = ${T - p}。`]],
        hint: `${n}x + ${p} = ${T}，把 ${p} 移到右邊。`,
      },
      coef: n, K: T - p,
      ans: { ok: `每枝原子筆 ${x} 元`, trap: [`筆記本 ${x} 元`, '題目問的是原子筆，不是筆記本。'] },
    };

  function wordAge(rng) {
    const D = rnd(rng, 6, 14), k = pick(rng, [2, 3]), x = rnd(rng, 2, 10), F = k * (D + x) - x;
    if (F < 28 || F > 55) return null;
    return {
      story: `爸爸今年 ${F} 歲，女兒今年 ${D} 歲。再過幾年，爸爸的年齡會是女兒的 ${k} 倍？`,
      params: { t: 'age', D, k, x, F }, x,
      define: { ok: 'x 年後', traps: [['女兒 x 歲', `女兒今年 ${D} 歲是已知的，題目問的是「幾年後」。`], ['爸爸 x 歲', `爸爸今年 ${F} 歲是已知的，題目問的是「幾年後」。`]] },
      eq: {
        L: `${F} + x`, R: `${k}(${D} + x)`,
        traps: [

          [`${k} × ${D} + x`, 'times_scope', `女兒 x 年後是 ${D} + x 歲，整個要乘 ${k}：${k}(${D} + x)。`],
          [`${D} + x`, 'times_missing', `爸爸的年齡是女兒的 ${k} 倍，女兒那邊要乘 ${k}。`],
        ],
      },
      simp: {
        accept: [[term(k - 1, 'x'), num(F - k * D)], [term(1 - k, 'x'), num(k * D - F)]],
        traps: [
          [num(F + k * D), 'sign_not_flipped', `${k * D} 移到另一邊要變號。`],
          [num(F - D), 'dist_first_only', `${k}(${D} + x) 要把 ${k} 乘進 ${D} 和 x：${k * D} + ${k}x。`],
        ],
        hint: `先去括號：${k}(${D} + x) = ${k * D} + ${k}x，再把 x 項放同一邊。`,
      },
      coef: k - 1, K: F - k * D,

    };
  }
  function wordRope(rng) {
    const x = rnd(rng, 8, 40), k = pick(rng, [2, 3]), m = rnd(rng, 3, 15), L = x + k * x + m;
    return {
      story: `一條長 ${L} 公分的緞帶剪成長、短兩段，長段比短段的 ${k} 倍多 ${m} 公分。短段是多少公分？`,
      params: { t: 'rope', x, k, m, L }, x,
      define: { ok: '短段 x 公分', traps: [['全長 x 公分', `全長 ${L} 公分是已知的，要設題目問的短段。`], ['長段比短段多 x 公分', '這個量題目沒有問，設成 x 列不出方程式。']] },

    pitch: '從文字題設未知數、拖出方程式、化簡、解出並作答。列式是學生最卡的一步。',
    kinds: {

      direction: '「幾年後」方向錯', times_scope: '倍數只乘到一部分', times_missing: '漏了倍數關係',
      miss_more: '漏了「多幾」', more_less: '「多、少」用錯運算', sign_not_flipped: '移項沒有變號',
      dist_first_only: '分配律只乘到第一項', combine_error: '合併同類項算錯', not_divided: '忘了除以係數',
      sign_error: '答案正負號錯', answer_entity: '答非所問',
    },
    stepLabels: { define: '設未知數', equation: '列方程式', simplify: '化簡', solve: '解出並作答' },
    make: makeWith('word1', (rng) => {
      const w = pick(rng, [wordBuy, wordAge, wordRope])(rng);
      if (!w) return null;
      const s1 = buildStep({
        key: 'define', goal: '設未知數：把「題目問的量」設成 x',
        line: ['設', { slot: 'u' }],
        cards: [{ key: 'ok', text: w.define.ok }, ...w.define.traps.map(([t], i) => ({ key: `t${i}`, text: t, trap: 'wrong_unknown' }))],
        accept: [{ u: 'ok' }],
        diagnose: w.define.traps.map(([, fb], i) => ({ when: { u: `t${i}` }, kind: 'wrong_unknown', fb })),
        hints: ['先找題目最後問的是什麼。', '已經知道的數字不用設成 x。', `設「${w.define.ok}」。`],
      }, rng);
      const s2 = buildStep({
        key: 'equation', goal: '列方程式：找出「相等」的兩個量，分別放在等號兩邊',
        line: [{ slot: 'l' }, '=', { slot: 'r' }],
        cards: [{ key: 'L', text: w.eq.L }, { key: 'R', text: w.eq.R }, ...w.eq.traps.map(([t, k], i) => ({ key: `t${i}`, text: t, trap: k }))],
        accept: [{ l: 'L', r: 'R' }, { l: 'R', r: 'L' }],
        diagnose: w.eq.traps.flatMap(([, k, fb], i) => [{ when: { l: `t${i}` }, kind: k, fb }, { when: { r: `t${i}` }, kind: k, fb }]),
        hints: ['想一想：題目裡哪兩個量會相等？', `一邊用 x 表示，另一邊是題目給的數。`, `其中一邊是 ${w.eq.L}。`],
      }, rng);
      const sa = w.simp.accept;
      const s3 = buildStep({
        key: 'simplify', goal: '化簡成「ax = 數」',
        line: [{ slot: 'l' }, '=', { slot: 'r' }],
        cards: [
          ...sa.flatMap(([cx, kk], i) => [{ key: `c${i}`, text: cx }, { key: `k${i}`, text: kk }]),
          ...w.simp.traps.map(([t, k], i) => ({ key: `t${i}`, text: t, trap: k })),
        ],
        accept: sa.map((_, i) => ({ l: `c${i}`, r: `k${i}` })),
        diagnose: w.simp.traps.flatMap(([t, k, fb], i) => (/x$/.test(t) ? [{ when: { l: `t${i}` }, kind: k, fb }] : [{ when: { r: `t${i}` }, kind: k, fb }])),
        fallback: '左右兩格要配成同一個等式：x 項和常數要對應。',
        hints: ['去括號、移項、合併，整理成「幾 x ＝ 一個數」。', w.simp.hint, `左邊是 ${sa[0][0]}。`],
      }, rng);
      const X = w.x;
      const s4 = buildStep({
        key: 'solve', goal: '解出 x，並用完整的句子回答',
        line: ['x =', { slot: 'v' }, '　答：', { slot: 'a' }],
        cards: [
          { key: 'v', text: num(X) },
          w.coef !== 1 && w.K !== X && { key: 'nd', text: num(w.K), trap: 'not_divided' },
          w.params.t === 'age' && { key: 'ng', text: num(-X), trap: 'sign_error' },
          { key: 'a', text: w.ans.ok },
          { key: 'ae', text: w.ans.trap[0], trap: 'answer_entity' },
        ],
        accept: [{ v: 'v', a: 'a' }],
        diagnose: [
          { when: { v: 'nd' }, kind: 'not_divided', fb: `${term(w.coef, 'x')} = ${num(w.K)}，還要兩邊同除以 ${w.coef}。` },
          { when: { v: 'ng' }, kind: 'sign_error', fb: '年數不會是負的，檢查化簡時 x 的係數正負號。' },
          { when: { a: 'ae' }, kind: 'answer_entity', fb: w.ans.trap[1] },
        ],
        hints: ['兩邊同除以 x 的係數。', `x = ${num(w.K)} ÷ ${w.coef}。`, `x = ${num(X)}，再回頭看題目問什麼。`],
      }, rng);
      return { story: w.story, stem: [], params: w.params, answer: { x: X }, answerText: w.ans.ok, steps: [s1, s2, s3, s4] };
    }),
  };

  SB.register(word1);
})();

// ---- packs/03-elim.js ----
// 內容包：加減消去法解二元一次聯立方程式
// 格式說明見 docs/pack-format.md；誘答卡、診斷規則、三層提示的寫法可以照這個檔案仿寫。
(function () {
  const { buildStep, makeWith, divideStep, rnd, pick, nz, gcd, num, sg, pn, op, term, lin, eqXY, fracText } = SB.tools;

  const elim = {
    id: 'elim', grade: '七下', title: '加減消去法', unit: '二元一次聯立方程式（加減消去）',
    pitch: '交叉乘倍數讓 y 的係數相同，判斷相加或相減，消去 y 後求 x，再代回求 y。',
    kinds: {
      self_coef: '乘的倍數配錯', rhs_not_scaled: '等號右邊沒有一起乘', partial_scale: '只乘了部分的項',
      add_sub: '加減選錯，y 沒有消去', sub_sign: '等號右邊的加減算錯', not_divided: '忘了除以係數',
      sign_error: '答案正負號錯', sign_not_flipped: '移項沒有變號',
    },
    stepLabels: { multiply: '乘倍數', scaled: '兩式乘開', eliminate: '相加或相減', solvex: '求 x', back: '代回求 y' },
    make: makeWith('elim', (rng) => {
      const x0 = nz(rng, -6, 6), y0 = nz(rng, -6, 6);
      const B = [1, 2, 3, 4, 5];
      const ab1 = pick(rng, B), ab2 = pick(rng, B);
      if (ab1 === ab2 || gcd(ab1, ab2) !== 1) return null;
      const b1 = ab1 * (rng() < 0.5 ? -1 : 1), b2 = ab2 * (rng() < 0.5 ? -1 : 1);
      const a1 = nz(rng, -5, 5), a2 = nz(rng, -5, 5);
      if (a1 * b2 - a2 * b1 === 0) return null;
      const c1 = a1 * x0 + b1 * y0, c2 = a2 * x0 + b2 * y0;
      if (Math.abs(c1) > 40 || Math.abs(c2) > 40) return null;
      const m1 = ab2, m2 = ab1, Lc = ab1 * ab2;
      const A1 = m1 * a1, B1 = m1 * b1, C1 = m1 * c1, A2 = m2 * a2, B2 = m2 * b2, C2 = m2 * c2;
      const same = Math.sign(B1) === Math.sign(B2);
      const A = same ? A1 - A2 : A1 + A2, K = same ? C1 - C2 : C1 + C2;
      if (!A || K % A !== 0 || K / A !== x0) return null;
      const s1 = buildStep({
        key: 'multiply', goal: '兩式各乘上多少，y 的係數絕對值才會相同？',
        line: ['① ×', { slot: 'm1' }, '　② ×', { slot: 'm2' }],
        cards: [
          { key: 'k1', text: num(m1) }, { key: 'k2', text: num(m2) },
          { key: 'd1', text: num(m1 + m2) },
          Lc !== m1 && Lc !== m2 && Lc !== m1 + m2 && { key: 'd2', text: num(Lc) },
        ],
        accept: [{ m1: 'k1', m2: 'k2' }],
        diagnose: [{ when: { m1: 'k2', m2: 'k1' }, kind: 'self_coef', fb: `乘上自己的係數，y 會變成 ${term(b1 * m2, 'y')} 和 ${term(b2 * m1, 'y')}，絕對值不同。要「交叉」乘對方的 y 係數。` }],
        fallback: `檢查：① 的 y 係數 ${num(b1)} 乘上第一格、② 的 y 係數 ${num(b2)} 乘上第二格，絕對值要相同。`,
        hints: [`看 y 的係數：① 是 ${num(b1)}、② 是 ${num(b2)}。`, `讓兩個 y 係數都變成 ${Lc} 或 −${Lc}。`, `① 要乘 ${m1}。`],
      }, rng);
      const big = m1 !== 1 ? 1 : 2; // 至少有一式的倍數不是 1
      const s2 = buildStep({
        key: 'scaled', goal: '把兩式乘開：等號兩邊的每一項都要乘',
        scaffold: `① × ${m1}，② × ${m2}`,
        line: ['①′', { slot: 'p' }, { br: 1 }, '②′', { slot: 'q' }],
        cards: [
          { key: 'e1', text: eqXY(A1, B1, C1) }, { key: 'e2', text: eqXY(A2, B2, C2) },
          m1 !== 1 && { key: 'r1', text: eqXY(A1, B1, c1), trap: 'rhs_not_scaled' },
          m2 !== 1 && { key: 'r2', text: eqXY(A2, B2, c2), trap: 'rhs_not_scaled' },
          big === 1 ? { key: 'pp', text: eqXY(A1, b1, C1), trap: 'partial_scale' } : { key: 'pp', text: eqXY(A2, b2, C2), trap: 'partial_scale' },
        ],
        accept: [{ p: 'e1', q: 'e2' }],
        diagnose: [
          { when: { p: 'r1' }, kind: 'rhs_not_scaled', fb: `等號右邊的 ${num(c1)} 也要乘 ${m1}，變成 ${num(C1)}。` },
          { when: { q: 'r2' }, kind: 'rhs_not_scaled', fb: `等號右邊的 ${num(c2)} 也要乘 ${m2}，變成 ${num(C2)}。` },
          { when: { p: 'pp' }, kind: 'partial_scale', fb: `① 的每一項都要乘 ${m1}，y 項也是。` },
          { when: { q: 'pp' }, kind: 'partial_scale', fb: `② 的每一項都要乘 ${m2}，y 項也是。` },
        ],
        fallback: '①′ 來自 ① 乘倍數、②′ 來自 ② 乘倍數，檢查有沒有放反。',
        hints: ['等號兩邊的每一項都要乘上同一個數。', `①′ 的 y 項是 ${term(B1, 'y')}，②′ 的 y 項是 ${term(B2, 'y')}。`, `①′ 是 ${eqXY(A1, B1, C1)}。`],
      }, rng);
      const Aw = same ? A1 + A2 : A1 - A2, Bw = same ? B1 + B2 : B1 - B2, Kw = same ? C1 + C2 : C1 - C2;
      const Ke = same ? C1 + C2 : C1 - C2;
      const s3 = buildStep({
        key: 'eliminate', goal: 'y 的係數同號要相減、異號要相加，才能消去 y',
        line: [{ slot: 'o' }, '，得', { slot: 'r' }],
        cards: [
          { key: 'oa', text: '①′ + ②′' }, { key: 'os', text: '①′ − ②′' },
          { key: 'ok', text: `${term(A, 'x')} = ${num(K)}` },
          { key: 'tw', text: eqXY(Aw, Bw, Kw), trap: 'add_sub' },
          Ke !== K && `${term(A, 'x')} = ${num(Ke)}` !== eqXY(Aw, Bw, Kw) && { key: 'tk', text: `${term(A, 'x')} = ${num(Ke)}`, trap: 'sub_sign' },
        ],
        accept: [{ o: same ? 'os' : 'oa', r: 'ok' }],
        diagnose: [
          { when: { o: same ? 'oa' : 'os' }, kind: 'add_sub', fb: `${term(B1, 'y')} 和 ${term(B2, 'y')} ${same ? '同號，要相減' : '異號，要相加'}才會消去。` },
          { when: { r: 'tw' }, kind: 'add_sub', fb: '這是用錯運算的結果，y 沒有消去。' },
          { when: { r: 'tk' }, kind: 'sub_sign', fb: `等號右邊也要${same ? '相減' : '相加'}：${num(C1)} ${same ? op(-C2) : op(C2)} = ${num(K)}。` },
        ],
        hints: [`看 y 的係數：${term(B1, 'y')} 和 ${term(B2, 'y')}。`, same ? '同號相減會變成 0。' : '一正一負相加會變成 0。', `用 ${same ? '①′ − ②′' : '①′ + ②′'}。`],
      }, rng);
      const s4 = buildStep({
        key: 'solvex', goal: '求出 x',
        line: ['x =', { slot: 'v' }],
        cards: [
          { key: 'v', text: num(x0) },
          Math.abs(A) !== 1 && { key: 'nd', text: num(K), trap: 'not_divided' },
          { key: 'ng', text: num(-x0), trap: 'sign_error' },
        ],
        accept: [{ v: 'v' }],
        diagnose: [
          { when: { v: 'nd' }, kind: 'not_divided', fb: `${term(A, 'x')} = ${num(K)}，還要兩邊同除以 ${num(A)}。` },
          { when: { v: 'ng' }, kind: 'sign_error', fb: `${num(K)} ÷ ${pn(A)} 是${x0 > 0 ? '正' : '負'}數。` },
        ],
        hints: ['兩邊同除以 x 的係數。', `x = ${num(K)} ÷ ${pn(A)}`, `x = ${num(x0)}`],
      }, rng);
      const R1 = c1 - a1 * x0;
      const s5 = buildStep({
        key: 'back', goal: '把 x 代回 ①，求出 y',
        scaffold: `代入 ①：${num(a1)} × ${pn(x0)} ${b1 < 0 ? '−' : '+'} ${term(Math.abs(b1), 'y')} = ${num(c1)}`,
        line: [{ slot: 'k' }, '，y =', { slot: 'y' }],
        cards: [
          { key: 'k', text: `${term(b1, 'y')} = ${num(R1)}` },
          { key: 'kw', text: `${term(b1, 'y')} = ${num(c1 + a1 * x0)}`, trap: 'sign_not_flipped' },
          { key: 'y', text: num(y0) },
          { key: 'yn', text: num(-y0), trap: 'sign_error' },
          Math.abs(b1) !== 1 && { key: 'yd', text: num(R1), trap: 'not_divided' },
        ],
        accept: [{ k: 'k', y: 'y' }],
        diagnose: [
          { when: { k: 'kw' }, kind: 'sign_not_flipped', fb: `${num(a1 * x0)} 移到右邊要變號：${num(c1)} ${op(-a1 * x0)} = ${num(R1)}。` },
          { when: { y: 'yn' }, kind: 'sign_error', fb: `${num(R1)} ÷ ${pn(b1)} 是${y0 > 0 ? '正' : '負'}數。` },
          { when: { y: 'yd' }, kind: 'not_divided', fb: `${term(b1, 'y')} = ${num(R1)}，還要兩邊同除以 ${num(b1)}。` },
        ],
        hints: [`先算 ${num(a1)} × ${pn(x0)} = ${num(a1 * x0)}。`, `把 ${num(a1 * x0)} 移到右邊。`, `${term(b1, 'y')} = ${num(R1)}。`],
      }, rng);
      return {
        stem: [`① ${eqXY(a1, b1, c1)}`, `② ${eqXY(a2, b2, c2)}`], params: { a1, b1, c1, a2, b2, c2 },
        answer: { x: x0, y: y0 }, answerText: `x = ${num(x0)}，y = ${num(y0)}`, steps: [s1, s2, s3, s4, s5],
      };
    }),
  };

  SB.register(elim);
})();

// ---- packs/04-subst.js ----
// 內容包：代入消去法解二元一次聯立方程式
// 格式說明見 docs/pack-format.md；誘答卡、診斷規則、三層提示的寫法可以照這個檔案仿寫。
(function () {
  const { buildStep, makeWith, divideStep, rnd, pick, nz, gcd, num, sg, pn, op, term, lin, eqXY, fracText } = SB.tools;

  const subst = {
    id: 'subst', grade: '七下', title: '代入消去法', unit: '二元一次聯立方程式（代入消去）',
    pitch: '把 ① 的 y 整個代入 ②，記得加括號；去括號、合併求 x，再代回 ① 求 y。',
    kinds: {
      no_paren: '代入時沒加括號', copy_sign: '代入時抄錯正負號', dist_first_only: '分配律只乘到第一項',
      dist_sign: '分配時正負號錯', sign_not_flipped: '移項沒有變號', combine_error: '合併同類項算錯',
      not_divided: '忘了除以係數', sign_error: '答案正負號錯', forgot_const: '漏加常數項',
    },
    stepLabels: { sub: '代入', expand: '去括號', combine: '移項合併', solvex: '求 x', solvey: '求 y' },
    make: makeWith('subst', (rng) => {
      const p = nz(rng, -4, 4), q = nz(rng, -8, 8), a = nz(rng, -5, 5), b = pick(rng, [-5, -4, -3, -2, 2, 3, 4, 5]);
      const x0 = nz(rng, -5, 5), y0 = p * x0 + q;
      if (!y0 || Math.abs(y0) > 15) return null;
      const c = a * x0 + b * y0, A = a + b * p;
      if (!A || Math.abs(c) > 50) return null;
      const yexp = lin([[p, 'x'], [q, '']]);
      const bp = b * p, bq = b * q, K = c - bq;
      const s1 = buildStep({
        key: 'sub', goal: '把 ① 的 y 代入 ②（y 是一整個式子）',
        line: [`${term(a, 'x')} + ${pn(b)} ×`, { slot: 's' }, `= ${num(c)}`],
        cards: [
          { key: 'ok', text: `(${yexp})` },
          { key: 'np', text: yexp, trap: 'no_paren' },
          { key: 'cs', text: `(${lin([[p, 'x'], [-q, '']])})`, trap: 'copy_sign' },
        ],
        accept: [{ s: 'ok' }],
        diagnose: [
          { when: { s: 'np' }, kind: 'no_paren', fb: `y 是一整個式子，代入要加括號：${pn(b)} × (${yexp})。不加括號，${num(b)} 只會乘到第一項。` },
          { when: { s: 'cs' }, kind: 'copy_sign', fb: `① 是 y = ${yexp}，常數項是 ${sg(q)}，抄的時候正負號要一樣。` },
        ],
        hints: ['② 裡的 y，換成 ① 等號右邊的式子。', '代入的是「一整個」式子，要加括號。', `放 (${yexp})。`],
      }, rng);
      const s2 = buildStep({
        key: 'expand', goal: '去括號：括號前的數乘進每一項',
        line: [term(a, 'x'), { slot: 'u' }, { slot: 'v' }, '=', num(c)],
        cards: [
          { key: 'u', text: term(bp, 'x', true) }, { key: 'v', text: sg(bq) },
          { key: 't1', text: sg(q), trap: 'dist_first_only' },
          { key: 't2', text: sg(-bq), trap: 'dist_sign' },
          { key: 't3', text: term(-bp, 'x', true), trap: 'dist_sign' },
        ],
        accept: [{ u: 'u', v: 'v' }],
        diagnose: [
          { when: { v: 't1' }, kind: 'dist_first_only', fb: `${pn(b)} 要乘進括號裡的每一項：${pn(b)} × ${pn(q)} = ${num(bq)}。` },
          { when: { v: 't2' }, kind: 'dist_sign', fb: `${pn(b)} × ${pn(q)} 要連同正負號算，等於 ${num(bq)}。` },
          { when: { u: 't3' }, kind: 'dist_sign', fb: `${pn(b)} × ${term(p, 'x')} = ${term(bp, 'x')}。` },
        ],
        hints: [`${pn(b)} 要乘括號裡的每一項。`, `${pn(b)} × ${term(p, 'x')}，以及 ${pn(b)} × ${pn(q)}。`, `x 項是 ${term(bp, 'x', true)}。`],
      }, rng);
      const s3 = buildStep({
        key: 'combine', goal: '合併 x 項，常數移到右邊',
        line: [{ slot: 'l' }, '=', { slot: 'r' }],
        cards: [
          { key: 'l', text: term(A, 'x') }, { key: 'r', text: num(K) },
          { key: 'kw', text: num(c + bq), trap: 'sign_not_flipped' },
          a - bp !== 0 && a - bp !== A && { key: 'cw', text: term(a - bp, 'x'), trap: 'combine_error' },
        ],
        accept: [{ l: 'l', r: 'r' }],
        diagnose: [
          { when: { r: 'kw' }, kind: 'sign_not_flipped', fb: `${sg(bq)} 移到右邊要變號：${num(c)} ${op(-bq)} = ${num(K)}。` },
          { when: { l: 'cw' }, kind: 'combine_error', fb: `${term(a, 'x')} ${term(bp, 'x', true).replace(/^([+−])/, '$1 ')} 要連同正負號算，等於 ${term(A, 'x')}。` },
        ],
        hints: ['兩個 x 項合併，常數移到等號右邊。', `x 的係數：${num(a)} ${op(bp)} = ${num(A)}。`, `右邊是 ${num(c)} ${op(-bq)} = ${num(K)}。`],
      }, rng);
      const s4 = buildStep({
        key: 'solvex', goal: '求出 x',
        line: ['x =', { slot: 'v' }],
        cards: [
          { key: 'v', text: num(x0) },
          Math.abs(A) !== 1 && { key: 'nd', text: num(K), trap: 'not_divided' },
          { key: 'ng', text: num(-x0), trap: 'sign_error' },
        ],
        accept: [{ v: 'v' }],
        diagnose: [
          { when: { v: 'nd' }, kind: 'not_divided', fb: `${term(A, 'x')} = ${num(K)}，還要兩邊同除以 ${num(A)}。` },
          { when: { v: 'ng' }, kind: 'sign_error', fb: `${num(K)} ÷ ${pn(A)} 是${x0 > 0 ? '正' : '負'}數。` },
        ],
        hints: ['兩邊同除以 x 的係數。', `x = ${num(K)} ÷ ${pn(A)}`, `x = ${num(x0)}`],
      }, rng);
      const s5 = buildStep({
        key: 'solvey', goal: '把 x 代回 ①，求出 y',
        line: [`y = ${num(p)} × ${pn(x0)} ${op(q)} =`, { slot: 'y' }],
        cards: [
          { key: 'y', text: num(y0) },
          { key: 'fc', text: num(p * x0), trap: 'forgot_const' },
          { key: 'yn', text: num(-y0), trap: 'sign_error' },
        ],
        accept: [{ y: 'y' }],
        diagnose: [
          { when: { y: 'fc' }, kind: 'forgot_const', fb: `${num(p)} × ${pn(x0)} = ${num(p * x0)}，還要 ${op(q)}。` },
          { when: { y: 'yn' }, kind: 'sign_error', fb: `${num(p * x0)} ${op(q)} 是${y0 > 0 ? '正' : '負'}數。` },
        ],
        hints: ['先乘再加。', `${num(p)} × ${pn(x0)} = ${num(p * x0)}。`, `${num(p * x0)} ${op(q)} = ${num(y0)}。`],
      }, rng);
      return {
        stem: [`① y = ${yexp}`, `② ${eqXY(a, b, c)}`], params: { p, q, a, b, c },
        answer: { x: x0, y: y0 }, answerText: `x = ${num(x0)}，y = ${num(y0)}`, steps: [s1, s2, s3, s4, s5],
      };
    }),
  };

  SB.register(subst);
})();

// ---- packs/05-word2.js ----
// 內容包：二元一次應用題（買票、雞兔同籠、硬幣三種題型）
// 格式說明見 docs/pack-format.md；誘答卡、診斷規則、三層提示的寫法可以照這個檔案仿寫。
(function () {
  const { buildStep, makeWith, divideStep, rnd, pick, nz, gcd, num, sg, pn, op, term, lin, eqXY, fracText } = SB.tools;

  const W2 = [
    { t: 'ticket', i1: '全票', i2: '學生票', u: '張', },
    { t: 'chicken', i1: '雞', i2: '兔子', u: '隻' },
    { t: 'coin', i1: '5 元硬幣', i2: '10 元硬幣', u: '枚' },
  ];
  const word2 = {
    id: 'word2', grade: '七下', title: '二元一次應用題', unit: '二元一次聯立方程式的應用（列式）',
    pitch: '設兩個未知數，拖出兩個方程式，用加減消去求解。張數和錢數不要混在一起。',
    kinds: {
      unit_confusion: '把單價當成未知數', wrong_unknown: '設錯未知數（設成已知量）', mix_total: '數量和總值混在同一式',
      swap_value: '單價（腳數）配錯對象', wrong_multiplier: '消去時乘錯數', rhs_not_scaled: '等號右邊沒有一起乘',
      not_divided: '忘了除以係數', swap_answer: 'x、y 答案對調', back_sub: '代回時沒有減',
    },
    stepLabels: { define: '設未知數', eq1: '數量的方程式', eq2: '總值的方程式', eliminate: '消去 x', solve: '求出解' },
    make: makeWith('word2', (rng) => {
      const T = pick(rng, W2);
      let v1, v2, x0, y0, story, val, vw;
      if (T.t === 'ticket') {
        v1 = pick(rng, [250, 300, 350, 400]); v2 = pick(rng, [120, 150, 180, 200]);
        x0 = rnd(rng, 2, 12); y0 = rnd(rng, 3, 18);
      } else if (T.t === 'chicken') { v1 = 2; v2 = 4; x0 = rnd(rng, 4, 20); y0 = rnd(rng, 3, 15); }
      else { v1 = 5; v2 = 10; x0 = rnd(rng, 3, 20); y0 = rnd(rng, 3, 20); }
      if (x0 === y0) return null;
      const N = x0 + y0, V = v1 * x0 + v2 * y0;
      vw = T.t === 'chicken' ? '總腳數' : '總金額';
      if (T.t === 'ticket') { story = `音樂會全票每張 ${v1} 元、學生票每張 ${v2} 元。某班共買了 ${N} 張票，花了 ${V} 元。全票和學生票各買了幾張？`; val = '元'; }
      else if (T.t === 'chicken') { story = `籠子裡有雞和兔子共 ${N} 隻，腳共有 ${V} 隻。雞和兔子各有幾隻？`; val = '隻腳'; }
      else { story = `撲滿裡只有 5 元和 10 元硬幣，共 ${N} 枚，總共 ${V} 元。5 元和 10 元硬幣各有幾枚？`; val = '元'; }
      const okDef = `${T.i1} x ${T.u}、${T.i2} y ${T.u}`;
      const unitTrap = T.t === 'chicken' ? `雞 x 隻腳、兔子 y 隻腳` : T.t === 'ticket' ? '全票每張 x 元、學生票每張 y 元' : '5 元硬幣 x 元、10 元硬幣 y 元';
      const s1 = buildStep({
        key: 'define', goal: '設兩個未知數：題目問的是「各有幾' + T.u + '」',
        line: ['設', { slot: 'u' }],
        cards: [
          { key: 'ok', text: okDef },
          { key: 'uc', text: unitTrap, trap: 'unit_confusion' },
          { key: 'wu', text: `共 x ${T.u}、共 y ${val}`, trap: 'wrong_unknown' },
        ],
        accept: [{ u: 'ok' }],
        diagnose: [
          { when: { u: 'uc' }, kind: 'unit_confusion', fb: T.t === 'chicken' ? '雞 2 隻腳、兔子 4 隻腳是已知的，要設的是隻數。' : '單價（面額）題目已經告訴你了，要設的是數量。' },
          { when: { u: 'wu' }, kind: 'wrong_unknown', fb: `共 ${N} ${T.u}、共 ${V} ${val}都是已知的。` },
        ],
        hints: ['題目最後問什麼？', `問的是兩種各有幾${T.u}。`, `設「${okDef}」。`],
      }, rng);
      const s2 = buildStep({
        key: 'eq1', goal: `第一個方程式：用「${T.u}數」相等列式`,
        line: ['①', { slot: 'e' }],
        cards: [
          { key: 'ok', text: `x + y = ${N}` },
          { key: 't1', text: `x + y = ${V}`, trap: 'mix_total' },
          { key: 't2', text: `${v1}x + ${v2}y = ${N}`, trap: 'mix_total' },
        ],
        accept: [{ e: 'ok' }],
        diagnose: [
          { when: { e: 't1' }, kind: 'mix_total', fb: `x + y 是${T.u}數，要等於 ${N}；${V} 是${vw}。` },
          { when: { e: 't2' }, kind: 'mix_total', fb: `${v1}x + ${v2}y 算的是${vw}，不是${T.u}數。` },
        ],
        hints: [`兩種的${T.u}數加起來是多少？`, `x + y 是總${T.u}數。`, `x + y = ${N}。`],
      }, rng);
      const s3 = buildStep({
        key: 'eq2', goal: `第二個方程式：用「${vw}」相等列式`,
        line: ['②', { slot: 'e' }],
        cards: [
          { key: 'ok', text: `${v1}x + ${v2}y = ${V}` },
          { key: 'sw', text: `${v2}x + ${v1}y = ${V}`, trap: 'swap_value' },
          { key: 'mt', text: `${v1}x + ${v2}y = ${N}`, trap: 'mix_total' },
        ],
        accept: [{ e: 'ok' }],
        diagnose: [
          { when: { e: 'sw' }, kind: 'swap_value', fb: `x 是${T.i1}，要乘${T.i1}的 ${v1}；y 是${T.i2}，乘 ${v2}。` },
          { when: { e: 'mt' }, kind: 'mix_total', fb: `${v1}x + ${v2}y 算的是${vw}，要等於 ${V}。` },
        ],
        hints: [`每一${T.u}${T.i1}是 ${v1}、每一${T.u}${T.i2}是 ${v2}。`, `${T.i1}的部分是 ${v1}x。`, `${v1}x + ${v2}y = ${V}。`],
      }, rng);
      const D = v2 - v1, R = V - v1 * N;
      const s4 = buildStep({
        key: 'eliminate', goal: '加減消去：② 減去 ① 的幾倍，可以消去 x？',
        line: ['② − ① ×', { slot: 'k' }, '：', { slot: 'r' }],
        cards: [
          { key: 'k', text: num(v1) },
          { key: 'kw', text: num(v2), trap: 'wrong_multiplier' },
          { key: 'r', text: `${term(D, 'y')} = ${num(R)}` },
          { key: 'rw', text: `${term(D, 'y')} = ${num(V - N)}`, trap: 'rhs_not_scaled' },
        ],
        accept: [{ k: 'k', r: 'r' }],
        diagnose: [
          { when: { k: 'kw' }, kind: 'wrong_multiplier', fb: `要消去 x：② 的 x 係數是 ${v1}，所以 ① 要乘 ${v1}。` },
          { when: { r: 'rw' }, kind: 'rhs_not_scaled', fb: `① 乘 ${v1} 時右邊也要乘：${V} − ${v1} × ${N} = ${R}。` },
        ],
        hints: [`② 的 x 係數是 ${v1}，① 的 x 係數是 1。`, `① × ${v1} 後再相減，x 就消去了。`, `${V} − ${v1} × ${N} = ${R}。`],
      }, rng);
      const s5 = buildStep({
        key: 'solve', goal: '先求 y，再代回 ① 求 x',
        scaffold: `${term(D, 'y')} = ${num(R)}，y = ${num(R)} ÷ ${D}；再由 x + y = ${N} 求 x`,
        line: ['x =', { slot: 'x' }, '，y =', { slot: 'y' }],
        cards: [
          { key: 'cx', text: num(x0) }, { key: 'cy', text: num(y0) },
          D !== 1 && R !== y0 && R !== x0 && R !== N && { key: 'nd', text: num(R), trap: 'not_divided' },
          { key: 'n', text: num(N), trap: 'back_sub' },
        ],
        accept: [{ x: 'cx', y: 'cy' }],
        diagnose: [
          { when: { x: 'cy', y: 'cx' }, kind: 'swap_answer', fb: `x 是${T.i1}、y 是${T.i2}，答案放反了。` },
          { when: { y: 'nd' }, kind: 'not_divided', fb: `${term(D, 'y')} = ${num(R)}，還要除以 ${D}。` },
          { when: { x: 'nd' }, kind: 'not_divided', fb: `先由 ${term(D, 'y')} = ${num(R)} 求 y，再求 x。` },
          { when: { x: 'n' }, kind: 'back_sub', fb: `x = ${N} − y = ${N} − ${y0} = ${x0}。` },
        ],
        hints: [`y = ${num(R)} ÷ ${D}。`, `y = ${y0}，代回 x + y = ${N}。`, `x = ${N} − ${y0} = ${x0}。`],
      }, rng);
      return {
        story, stem: [], params: { t: T.t, v1, v2, N, V }, answer: { x: x0, y: y0 },
        answerText: `${T.i1} ${x0} ${T.u}、${T.i2} ${y0} ${T.u}`, steps: [s1, s2, s3, s4, s5],
      };
    }),
  };

  SB.register(word2);
})();

</script>
<script>
(function () {
  const { PACKS, checkStep, revealHint, stepScore, SCORING, slotIds, mulberry32 } = window.SB;
  const app = document.getElementById('app');
  const BOSS_HP = 120, BOSS_SEC = 240;
  const PLAYER_KEY = 'education-math-board:player';
  let player = '';
  try { player = localStorage.getItem(PLAYER_KEY) || ''; } catch (e) { /* 無法使用瀏覽器儲存 */ }
  function setPlayer(v) {
    player = v.trim().slice(0, 12);
    try { localStorage.setItem(PLAYER_KEY, player); } catch (e) { /* 無法使用瀏覽器儲存 */ }
    const el = document.getElementById('shot-player'); if (el) el.textContent = player || '（未填）';
  }
  function setHash(h) {
    try { history.replaceState(null, '', h ? `#${h}` : location.pathname + location.search); } catch (e) { /* 沙盒可能不允許改網址 */ }
  }

  // ---------- 小工具 ----------
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function M(s) {
    return esc(s)
      .replace(/(^|[^A-Za-z])([xy])(?![A-Za-z])/g, '$1<i>$2</i>')
      .replace(/\[frac:(\d+)\|(\d+)\]/g, '<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  let timers = [];
  const clearTimers = () => { timers.forEach((t) => clearInterval(t)); timers = []; };

  // ---------- 狀態 ----------
  let S = null;
  function newSession(pack, mode) {
    S = {
      pack, mode, problemNo: 0, score: 0, streak: 0, best: 0, events: [], stepResults: [],
      boss: mode === 'boss' ? { hp: BOSS_HP, endsAt: Date.now() + BOSS_SEC * 1000, over: null } : null,
    };
    nextProblem();
  }
  function nextProblem() {
    S.problemNo++;
    S.problem = S.pack.make(Math.random);
    S.stepIdx = 0; S.done = [];
    S.results = [];
    startStep();
  }
  function startStep() {
    S.pl = {}; S.sel = null; S.errors = 0; S.hint = 0; S.fb = null; S.wrong = []; S.hl = null; S.t0 = Date.now();
  }
  const step = () => S.problem.steps[S.stepIdx];
  const cardOf = (id) => step().cards.find((c) => c.id === id);

  // ---------- 操作 ----------
  function place(slot, cardId) {
    for (const k of Object.keys(S.pl)) if (S.pl[k] === cardId) delete S.pl[k];
    S.pl[slot] = cardId; S.sel = null; S.wrong = S.wrong.filter((w) => w !== slot); S.fb = null;
  }
  function tapSlot(slot) {
    if (S.sel) place(slot, S.sel);
    else if (S.pl[slot]) { delete S.pl[slot]; S.fb = null; }
    renderPlay();
  }
  function tapCard(id) { S.sel = S.sel === id ? null : id; renderPlay(); }
  function check() {
    const st = step();
    const res = checkStep(st, S.pl);
    if (res.kind === 'incomplete') { S.fb = { t: 'info', h: res.fb }; S.wrong = res.wrong; return renderPlay(); }
    S.events.push({ pack: S.pack.id, no: S.problemNo, step: st.key, ok: res.ok, kind: res.kind, ms: Date.now() - S.t0, hint: S.hint, errorsBefore: S.errors });
    if (!res.ok) {
      S.errors++; S.streak = 0; S.wrong = res.wrong;
      const label = S.pack.kinds[res.kind] || '這一行還不成立';
      S.fb = { t: 'bad', h: `<span class="kind">${esc(label)}</span>${M(res.fb)}` };
      if (S.boss) bossAnim('taunt');
      return renderPlay();
    }
    const pts = stepScore(S.errors, S.hint);
    S.score += pts;
    if (!S.errors && !S.hint) { S.streak++; S.best = Math.max(S.best, S.streak); } else S.streak = 0;
    S.results.push({ key: st.key, pts, errors: S.errors, hint: S.hint, ms: Date.now() - S.t0 });
    S.stepResults.push({ key: st.key, first: !S.errors && !S.hint, ms: Date.now() - S.t0 });
    S.done.push({ step: st, pl: { ...S.pl } });
    if (S.boss) damage(pts);
    if (S.stepIdx + 1 < S.problem.steps.length) {
      S.stepIdx++; startStep();
      S.fb = { t: 'ok', h: `成立！+${pts} 分` };
    } else {
      S.stepIdx++;
      const clean = S.results.every((r) => !r.errors && !r.hint);
      S.bonus = clean ? SCORING.clean : 0;
      S.score += S.bonus;
      if (S.boss && S.bonus) damage(S.bonus, true);
    }
    renderPlay();
  }
  function hint() {
    if (S.hint >= 3) return;
    S.hint++;
    S.events.push({ pack: S.pack.id, no: S.problemNo, step: step().key, ok: null, kind: 'hint', level: S.hint });
    if (S.hint === 3) S.hl = revealHint(step(), S.pl);
    renderPlay();
  }

  // ---------- 魔王 ----------
  function damage(n, bonus) {
    const b = S.boss; if (!b || b.over) return;
    b.hp = Math.max(0, b.hp - n);
    bossAnim('hit');
    const face = document.querySelector('.boss-face');
    if (face) {
      const r = face.getBoundingClientRect();
      const d = document.createElement('div');
      d.className = 'dmg'; d.textContent = `−${n}${bonus ? ' 完美' : ''}`;
      d.style.left = `${r.right + 8}px`; d.style.top = `${r.top}px`;
      document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
    }
    if (b.hp <= 0) { b.over = 'win'; setTimeout(() => { if (S && S.boss === b) showReport(); }, 900); }
  }
  function bossAnim(cls) {
    const f = document.querySelector('.boss-face'); if (!f) return;
    f.classList.remove('hit', 'taunt'); void f.offsetWidth; f.classList.add(cls);
  }
  function tickBoss() {
    const b = S && S.boss; if (!b || b.over) return;
    const left = Math.max(0, Math.ceil((b.endsAt - Date.now()) / 1000));
    const el = document.getElementById('clock');
    if (el) { el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; el.classList.toggle('low', left <= 30); }
    if (left <= 0) { b.over = 'time'; showReport(); }
  }

  // ---------- 拖曳 ----------
  let drag = null;
  function onDown(e) {
    const c = e.target.closest('.card[data-card]');
    if (!c) return;
    drag = { id: c.dataset.card, x: e.clientX, y: e.clientY, el: c, ghost: null, over: null };
    try { c.setPointerCapture(e.pointerId); } catch (err) { /* 部分瀏覽器不支援 */ }
  }
  function onMove(e) {
    if (!drag) return;
    if (!drag.ghost) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
      drag.ghost = drag.el.cloneNode(true);
      drag.ghost.classList.add('ghost'); drag.ghost.classList.remove('sel', 'hl');
      document.body.appendChild(drag.ghost);
    }
    drag.ghost.style.left = `${e.clientX}px`; drag.ghost.style.top = `${e.clientY}px`;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const slot = under && under.closest('.slot[data-slot]');
    if (drag.over && drag.over !== slot) drag.over.classList.remove('over');
    drag.over = slot; if (slot) slot.classList.add('over');
  }
  function onUp(e) {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.ghost) {
      d.ghost.remove();
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const slot = under && under.closest('.slot[data-slot]');
      if (slot) { place(slot.dataset.slot, d.id); renderPlay(); }
      else if (d.over) d.over.classList.remove('over');
    } else tapCard(d.id);
  }
  function onCancel() { if (drag && drag.ghost) drag.ghost.remove(); drag = null; }

  // ---------- 畫面：算式行 ----------
  function lineHTML(st, pl, live) {
    const card = (id) => st.cards.find((c) => c.id === id);
    const tok = (t) => {
      if (typeof t === 'string') return `<span class="m">${M(t)}</span>`;
      if (t.br) return '<span class="brk"></span>';
      if (t.frac) return `<span class="frac"><span>${t.frac[0].map(tok).join('')}</span><span>${t.frac[1].map(tok).join('')}</span></span>`;
      const id = pl[t.slot], c = id && card(id);
      if (!live) return `<span class="m filled-txt">${M(c ? c.text : '')}</span>`;
      const cls = ['slot']; if (c) cls.push('filled'); if (S.wrong.includes(t.slot)) cls.push('wrong'); if (S.hl && S.hl.slot === t.slot) cls.push('hl');
      return `<button class="${cls.join(' ')} m" data-slot="${t.slot}" aria-label="空格${c ? '：' + esc(c.text) : ''}"><span>${c ? M(c.text) : ''}</span></button>`;
    };
    return st.line.map(tok).join('');
  }
  function stemHTML(p) {
    let h = '';
    if (p.story) h += `<div class="story">${M(p.story)}</div>`;
    if (p.stem.length === 1) h += `<div class="stem m">解方程式：${M(p.stem[0])}</div>`;
    if (p.stem.length === 2) h += `<div class="sys m"><span class="brace" aria-hidden="true">{</span><div class="lines">${p.stem.map((l) => `<div>${M(l)}</div>`).join('')}</div></div>`;
    return h;
  }

  function statsHTML() {
    if (S.boss) return `<div class="stats"><span class="stat">分數 <b>${S.score}</b></span><button class="btn" data-act="report" style="min-height:40px">結束，看紀錄</button></div>`;
    return `<div class="stats"><span class="stat">分數 <b>${S.score}</b></span><span class="stat">連續一次成立 <b>${S.streak}</b></span><span class="stat">完成 <b>${S.problemNo - (S.stepIdx < S.problem.steps.length ? 1 : 0)}</b> 題</span><button class="btn" data-act="report" style="min-height:40px">結束，看紀錄</button></div>`;
  }

  function renderPlay() {
    const p = S.problem, finished = S.stepIdx >= p.steps.length;
    const b = S.boss;
    const doneLines = S.done.map((d, i) => `<div class="bline done"><span class="no">${i + 1}. ${esc(S.pack.stepLabels[d.step.key])}</span>${lineHTML(d.step, d.pl, false)}</div>`).join('');
    let right;
    if (!finished) {
      const st = step();
      const used = new Set(Object.values(S.pl));
      right = `
        <div class="step-head"><b>第 ${S.stepIdx + 1} / ${p.steps.length} 步・${esc(S.pack.stepLabels[st.key])}</b><span class="muted" style="font-size:14px">本步最高 10 分</span></div>
        <div class="goal">${M(st.goal)}</div>
        ${st.scaffold ? `<div class="scaffold m">${M(st.scaffold)}</div>` : ''}
        ${S.fb ? `<div class="fb ${S.fb.t}" role="status" aria-live="polite">${S.fb.h}</div>` : '<div class="fb" role="status" aria-live="polite">把卡片拖進左邊的空格，或先點卡片、再點空格。點已放好的卡片可以拿回來。</div>'}
        <div class="tray" aria-label="卡片">${st.cards.map((c) => `<button class="card m ${used.has(c.id) ? 'used' : ''} ${S.sel === c.id ? 'sel' : ''} ${S.hl && S.hl.card === c.id ? 'hl' : ''}" data-card="${c.id}" ${used.has(c.id) ? 'tabindex="-1" aria-hidden="true"' : ''}><span>${M(c.text)}</span></button>`).join('')}</div>
        <ol class="hints">${st.hints.slice(0, S.hint).map((h, i) => `<li>${i === 2 ? '（亮黃框的格子放亮黃框的卡）' : ''}${M(h)}</li>`).join('')}</ol>
        <div class="actions">
          <button class="btn" data-act="hint" ${S.hint >= 3 ? 'disabled' : ''}>提示 ${S.hint}/3</button>
          <button class="btn" data-act="clear">清空</button>
          <button class="btn primary" data-act="check">檢查這一步</button>
        </div>`;
    } else {
      const total = S.results.reduce((s, r) => s + r.pts, 0) + S.bonus;
      right = `
        <div class="review">
          <h3>這一題完成了</h3>
          <p style="margin:0">答案：<b class="m">${M(p.answerText)}</b></p>
          <table class="rtable"><thead><tr><th>步驟</th><th>錯誤</th><th>提示</th><th style="text-align:right">得分</th></tr></thead>
            <tbody>${S.results.map((r) => `<tr><td>${esc(S.pack.stepLabels[r.key])}</td><td>${r.errors || '—'}</td><td>${r.hint || '—'}</td><td class="n">${r.pts}</td></tr>`).join('')}
            ${S.bonus ? `<tr><td colspan="3">零錯誤、零提示加分</td><td class="n">+${S.bonus}</td></tr>` : ''}
            <tr><td colspan="3"><b>這一題</b></td><td class="n"><b>${total}</b></td></tr></tbody></table>
          <div class="row end"><button class="btn" data-act="report">結束，看紀錄</button><button class="btn primary" data-act="next">下一題</button></div>
        </div>`;
    }
    app.innerHTML = `
      <div class="gbar">
        <button class="btn" data-go="hub" style="min-height:44px">← 解題館</button>
        <h2>${esc(S.pack.title)}</h2>
        <span class="chip ${b ? 'boss' : ''}">${b ? '魔王對戰' : '練習'}</span>
        ${statsHTML()}
      </div>
      ${b ? `<div class="bossbar"><div class="boss-face" aria-hidden="true">x</div>
        <div class="hpwrap"><div class="lbl"><b>未知數魔王</b><span>${b.hp} / ${BOSS_HP}</span></div><div class="hp"><i style="width:${(b.hp / BOSS_HP) * 100}%"></i></div>
        <span class="muted" style="font-size:13px">每完成一步就攻擊一次；一次成立傷害最高。錯了不扣血，但這一步的傷害會變少。</span></div>
        <div class="clock" id="clock" aria-label="剩餘時間">4:00</div></div>` : ''}
      <div class="work">
        <section class="panel">
          <div class="ptitle">${esc(S.pack.grade)}・${esc(S.pack.unit)}　第 ${S.problemNo} 題</div>
          ${stemHTML(p)}
          <div class="board">${doneLines}${!finished ? `<div class="bline cur"><span class="no">${S.stepIdx + 1}. ${esc(S.pack.stepLabels[step().key])}</span>${lineHTML(step(), S.pl, true)}</div>` : ''}</div>
        </section>
        <section class="panel">${right}</section>
      </div>
      <details class="kinds-d"><summary>這個內容包對準的誤解（${Object.keys(S.pack.kinds).length} 種）</summary><div>${Object.values(S.pack.kinds).map((k) => `<span class="chip trap">${esc(k)}</span>`).join('')}</div></details>`;
    if (b) tickBoss();
  }

  // ---------- 報告（截圖傳給老師） ----------
  function showReport() {
    clearTimers(); setHash('');
    const ev = S.events.filter((e) => e.ok !== null);
    const kinds = {};
    ev.filter((e) => !e.ok && e.kind !== 'other').forEach((e) => { kinds[e.kind] = (kinds[e.kind] || 0) + 1; });
    const other = ev.filter((e) => !e.ok && e.kind === 'other').length;
    const sr = S.stepResults;
    const first = sr.length ? Math.round((sr.filter((r) => r.first).length / sr.length) * 100) : 0;
    const hints = S.events.filter((e) => e.kind === 'hint').length;
    const solved = S.problemNo - (S.stepIdx < S.problem.steps.length ? 1 : 0);
    const byStep = {};
    sr.forEach((r) => { const s = (byStep[r.key] ||= { n: 0, first: 0, ms: 0 }); s.n++; s.first += r.first ? 1 : 0; s.ms += r.ms; });
    const stepRows = Object.entries(byStep).map(([k, s]) => ({ k, n: s.n, first: Math.round((s.first / s.n) * 100), sec: s.ms / s.n / 1000 }));
    const slowest = stepRows.reduce((a, r) => (!a || r.sec > a.sec ? r : a), null);
    const ranked = Object.entries(kinds).sort((a, b) => b[1] - a[1]);
    const maxK = ranked.length ? ranked[0][1] : 1;
    const b = S.boss;
    const head = b ? (b.over === 'win' ? '打倒未知數魔王！' : b.over === 'time' ? `時間到，魔王還剩 ${b.hp} 血` : '對戰結束') : '練習結束';
    const advice = ranked.length
      ? `最常出現「${S.pack.kinds[ranked[0][0]]}」，可以挑一題請學生說說錯在哪裡，再對照正確的一行。${slowest && stepRows.length > 1 ? `「${S.pack.stepLabels[slowest.k]}」這一步平均最久。` : ''}`
      : '這一局沒有出現誤解，可以挑戰下一個內容包。';
    const now = new Date();
    const when = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    app.innerHTML = `
      <div class="gbar"><button class="btn" data-go="hub" style="min-height:44px">← 解題館</button><h2>${esc(S.pack.title)}</h2><span class="chip ${b ? 'boss' : ''}">${b ? '魔王對戰' : '練習'}</span></div>
      <div class="shot-tip">請把下面這張<b>紀錄卡</b>截圖，傳給老師。</div>
      ${player ? '' : `<label class="who inline"><span>先填班級-座號</span><input id="player" value="" placeholder="例：715-08" maxlength="12" autocomplete="off"></label>`}
      <section class="shot" aria-label="紀錄卡">
        <div class="shot-head">
          <div><span>班級-座號</span><b id="shot-player">${esc(player || '（未填）')}</b></div>
          <div><span>內容</span><b>${esc(S.pack.grade)} ${esc(S.pack.title)}・${b ? '魔王對戰' : '練習'}</b></div>
          <div><span>時間</span><b>${when}</b></div>
        </div>
        <h2 class="shot-title">${esc(head)}</h2>
        <div class="tiles">
          <div class="tile"><span>完成題數</span><b>${solved}</b></div>
          <div class="tile"><span>完成步數</span><b>${sr.length}</b></div>
          <div class="tile"><span>首次正確率</span><b>${first}%</b></div>
          <div class="tile"><span>用了提示</span><b>${hints}</b></div>
          <div class="tile"><span>總分</span><b>${S.score}</b></div>
        </div>
        <div class="shot-grid">
          <div>
            <h3>誤解排行</h3>
            ${ranked.length ? `<div class="bars">${ranked.map(([k, n]) => `<div class="barrow"><span>${esc(S.pack.kinds[k])}</span><span class="track"><i style="width:${(n / maxK) * 100}%"></i></span><span class="n">${n}</span></div>`).join('')}</div>` : '<p class="muted" style="margin:0">沒有出現誤解。</p>'}
            ${other ? `<p class="muted" style="margin:6px 0 0;font-size:14px">另有 ${other} 次未歸類的錯誤。</p>` : ''}
          </div>
          ${stepRows.length ? `<div><h3>各步驟表現</h3>
            <table class="rtable"><thead><tr><th>步驟</th><th style="text-align:right">次數</th><th style="text-align:right">首次正確</th><th style="text-align:right">平均秒數</th></tr></thead>
            <tbody>${stepRows.map((r) => `<tr class="${slowest && r.k === slowest.k && stepRows.length > 1 ? 'slow' : ''}"><td>${esc(S.pack.stepLabels[r.k])}</td><td class="n">${r.n}</td><td class="n">${r.first}%</td><td class="n">${r.sec.toFixed(1)}</td></tr>`).join('')}</tbody></table></div>` : ''}
        </div>
        <p class="advice"><b>給老師：</b>${esc(advice)}</p>
      </section>
      <p class="muted" style="font-size:14px">這份紀錄只存在這台裝置上，離開頁面就不見了。</p>
      <div class="row end"><button class="btn" data-go="hub">回解題館</button><button class="btn ${b ? 'boss' : 'primary'}" data-again="${b ? 'boss' : 'practice'}">再玩一次</button></div>`;
    window.scrollTo(0, 0);
  }
  // ---------- 入口 ----------
  const PROMPT = `請照 AGENTS.md，幫我新增一個拖移解題板的內容包。
單元：＿＿＿＿（例：八上 乘法公式）
學習目標：學生能＿＿＿＿
我上課時的解題步驟：
1. ＿＿＿＿
2. ＿＿＿＿
3. ＿＿＿＿
我常看到的錯誤：
1. ＿＿＿＿
2. ＿＿＿＿
3. ＿＿＿＿
請先整理步驟與誤解給我確認，再寫內容包、跑測試、重新建置。`;

  function packCard(pk) {
    const p = pk.make(mulberry32(11));
    const sample = p.story ? M(p.story) : p.stem.length >= 2 ? M(p.stem.join('，')) : M(p.stem[0] || '');
    const n = Object.keys(pk.kinds).length;
    return `<article class="pack">
      <div class="row"><span class="chip">${esc(pk.grade)}</span><span class="chip plain">${p.steps.length} 步</span></div>
      <h3>${esc(pk.title)}</h3>
      <p>${esc(pk.pitch)}</p>
      <div class="sample m">${sample}</div>
      <div class="kinds">${Object.values(pk.kinds).slice(0, 5).map((k) => `<span class="chip trap">${esc(k)}</span>`).join('')}${n > 5 ? `<span class="chip plain">還有 ${n - 5} 種</span>` : ''}</div>
      <div class="btns"><button class="btn primary" data-start="${pk.id}" data-mode="practice">練習</button><button class="btn boss" data-start="${pk.id}" data-mode="boss">魔王對戰</button></div>
    </article>`;
  }

  function showHub() {
    clearTimers(); S = null; setHash('');
    const grades = [...new Set(PACKS.map((p) => p.grade))];
    app.innerHTML = `
      <header class="hero">
        <span class="eyebrow">國中數學・拖移解題板</span>
        <h1>拖移<mark>解題館</mark></h1>
        <p class="lead">把卡片拖進算式的空格，一行一行組出解題過程。每一張錯的卡片，都對準一個常見的錯誤；選錯了，系統會告訴你錯在哪裡。</p>
        <div class="row" style="margin-top:6px">
          <label class="who"><span>班級-座號</span><input id="player" value="${esc(player)}" placeholder="例：715-08" maxlength="12" autocomplete="off"></label>
          <span class="muted" style="font-size:14px;flex:1 1 220px">結束時會顯示在紀錄卡上，方便截圖傳給老師。不要輸入真實姓名。</span>
        </div>
        <div class="demo-line" aria-label="示意">
          <span class="cap">例：去括號這一步，你會拖哪一張？</span>
          <div class="eq m"><span>${M('−3(x + 2) =')}</span><span class="mini-slot">${M('−3x')}</span><span class="mini-slot">?</span></div>
          <div class="row"><span class="mini-card m">${M('−6')}</span><span class="mini-card trap m">${M('+2')}</span><span class="mini-card trap m">${M('+6')}</span><span class="cap">紅框是誘答：只乘第一項、正負號錯</span></div>
        </div>
      </header>
      ${grades.map((g) => `<div class="section-h"><h2>${esc(g)}</h2></div><div class="packs">${PACKS.filter((p) => p.grade === g).map(packCard).join('')}</div>`).join('')}
      <div class="section-h"><h2>兩種玩法</h2><p>同一個解題板，換一個外殼</p></div>
      <div class="twoq">
        <div><b>練習</b><p>自己的節奏，沒有時間壓力。每一步都可以看提示。</p></div>
        <div><b>魔王對戰</b><p>4 分鐘內打倒未知數魔王。每完成一步就攻擊一次，一次就做對的傷害最高。</p></div>
      </div>
      <details class="teacher">
        <summary>給老師：設計原理、直接連結、做自己的內容包</summary>
        <div class="teacher-body">
          <div class="principles">
            <div><b>拖的是過程</b><span>每一步都要自己組出算式，不是從選項挑最後答案。</span></div>
            <div><b>錯卡就是誤解</b><span>誘答卡由誤解規則產生，選了哪一張就是診斷資料。</span></div>
            <div><b>每一步都留紀錄</b><span>結束時的紀錄卡列出誤解排行和卡最久的步驟。</span></div>
          </div>
          <div class="design"><table><tbody>
            <tr><th>1 教學目標</th><td>學生能依序完成去括號、移項、合併、消去、代回等步驟，並從文字題列出方程式。</td></tr>
            <tr><th>2 評量證據</th><td>學生在每一個空格放了哪張卡、第一次就成立的比例、用了幾層提示。<span>每次「檢查」都記一筆：步驟、對錯、誤解代碼、秒數。</span></td></tr>
            <tr><th>3 核心機制</th><td>把數、項、式子拖進算式的空格，組出這一步的數學關係。完成的行留在板子上，下一步引用它。</td></tr>
            <tr><th>4 誤解→誘答</th><td>每張錯卡對準一個誤解，各有一句診斷回饋。</td></tr>
            <tr><th>5 回饋與計分</th><td>每步 10 分，錯一次 −1（最多 −3），提示依層數 −2／−4／−6，每步最低 3 分；整題零錯零提示 +5。<span>分數付給「獨立完成」，不付給手速。</span></td></tr>
            <tr><th>6 鷹架</th><td>三層提示：方向 → 關鍵關係 → 標出一個空格該放哪張卡。</td></tr>
            <tr><th>7 課堂運作</th><td>例題後 15～20 分鐘獨立練習；最後 5 分鐘全班一起打魔王；學生截圖紀錄卡繳交。</td></tr>
            <tr><th>8 資料留痕</th><td>紀錄卡顯示誤解排行、各步驟首次正確率與平均秒數，以及給老師的建議。</td></tr>
          </tbody></table></div>
          <div class="twoq">
            <div><b>問題 1：拿掉數學，還玩得下去嗎？</b><p>玩不下去。沒有「這一項要不要變號、要乘多少」的判斷，就沒有任何可以拖的卡。</p></div>
            <div><b>問題 2：遊戲操作就是要評量的數學行為嗎？</b><p>是。要評量的是「建立每一步的等式」，遊戲操作正是把量放進那個等式的正確位置。</p></div>
          </div>
          <div>
            <h3 style="margin:0 0 6px;font-size:20px">直接連結到某個內容包</h3>
            <p style="margin:0">在網址最後加上 <code>#代號</code> 是練習，加上 <code>#代號-boss</code> 是魔王對戰。現有代號：${PACKS.map((p) => `<code>${esc(p.id)}</code>（${esc(p.title)}）`).join('、')}。</p>
          </div>
          <div>
            <h3 style="margin:0 0 6px;font-size:20px">做自己的內容包</h3>
            <p style="margin:0 0 8px">用 AI Agent 打開這個專案，把下面這段貼給它，填好空格。</p>
            <div class="prompt"><pre id="prompt-text">${esc(PROMPT)}</pre></div>
            <div class="row end" style="margin-top:10px"><span id="copy-note" class="muted" style="font-size:14px" aria-live="polite"></span><button class="btn primary" data-act="copy">複製提示詞</button></div>
          </div>
        </div>
      </details>
      <p class="credit">遊戲機制與設計規範參考三師爸的開源專案 <a href="https://github.com/mathruffian-dot/math-game-templates" target="_blank" rel="noopener">mathruffian-dot/math-game-templates</a>（MIT 授權）的 T3 拖拉解題板。</p>`;
    window.scrollTo(0, 0);
  }
  function start(id, mode) {
    const pk = PACKS.find((p) => p.id === id); if (!pk) return showHub();
    clearTimers();
    newSession(pk, mode);
    setHash(mode === 'boss' ? `${id}-boss` : id);
    renderPlay(); window.scrollTo(0, 0);
    if (mode === 'boss') timers.push(setInterval(tickBoss, 250));
  }

  // ---------- 事件 ----------
  app.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
  app.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.card) return; // 卡片由 pointer 事件處理（含點選）
    if (b.dataset.go === 'hub') return showHub();
    if (b.dataset.start) return start(b.dataset.start, b.dataset.mode);
    if (b.dataset.again) return start(S.pack.id, b.dataset.again);
    if (b.dataset.slot) return tapSlot(b.dataset.slot);
    const act = b.dataset.act;
    if (act === 'check') return check();
    if (act === 'hint') return hint();
    if (act === 'clear') { S.pl = {}; S.sel = null; S.wrong = []; S.fb = null; return renderPlay(); }
    if (act === 'next') { nextProblem(); renderPlay(); return window.scrollTo(0, 0); }
    if (act === 'report') return showReport();
    if (act === 'copy') {
      const note = document.getElementById('copy-note');
      try { await navigator.clipboard.writeText(PROMPT); note.textContent = '已複製'; }
      catch (err) {
        const r = document.createRange(); r.selectNodeContents(document.getElementById('prompt-text'));
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        note.textContent = '已選取文字，請按複製';
      }
    }
  });
  // 鍵盤：卡片用 Enter / 空白鍵選取
  app.addEventListener('keydown', (e) => {
    const c = e.target.closest && e.target.closest('.card[data-card]');
    if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tapCard(c.dataset.card); }
  });

  app.addEventListener('input', (e) => { if (e.target.id === 'player') setPlayer(e.target.value); });

  // 網址 #代號 直接進練習、#代號-boss 直接進魔王對戰
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    const direct = PACKS.find((p) => p.id === h);
    const boss = !direct && h.endsWith('-boss') && PACKS.find((p) => p.id === h.slice(0, -5));
    if (direct) start(direct.id, 'practice');
    else if (boss) start(boss.id, 'boss');
    else showHub();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
