<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="國中數學拖移解題板：把卡片拖進算式空格，一步一步組出解題過程；錯的卡片對準常見誤解。">
<title>拖移解題館</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面概念：方格紙上的解題板——左邊是一行一行搭起來的算式，右邊是可拖的卡片盤；錯的卡片＝真實的誤解 */
:root {
  --paper: #f4f7fb;
  --panel: #ffffff;
  --ink: #18223d;
  --muted: #56617f;
  --line: #d3dbea;
  --grid: rgba(54, 96, 190, 0.075);
  --blue: #2449c9;
  --blue-soft: #e4eafd;
  --hl: #ffd84a;
  --hl-ink: #3b2f00;
  --ok: #17864a;
  --ok-soft: #e1f4e8;
  --bad: #cc2f2f;
  --bad-soft: #fbe3e3;
  --boss: #7a2fc0;
  --boss-soft: #efe4fa;
  --font-display: "Huninn", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-math: "Times New Roman", "Noto Serif TC", Georgia, serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1528; --panel: #18203a; --ink: #e7ebf6; --muted: #9ba6c6; --line: #2d3862;
    --grid: rgba(140, 170, 255, 0.07); --blue: #85a0ff; --blue-soft: #232f5c; --hl: #ffd84a; --hl-ink: #2b2200;
    --ok: #45d08a; --ok-soft: #183a2a; --bad: #ff6d6d; --bad-soft: #43222a; --boss: #c79bff; --boss-soft: #2f2148;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1528; --panel: #18203a; --ink: #e7ebf6; --muted: #9ba6c6; --line: #2d3862;
  --grid: rgba(140, 170, 255, 0.07); --blue: #85a0ff; --blue-soft: #232f5c; --hl: #ffd84a; --hl-ink: #2b2200;
  --ok: #45d08a; --ok-soft: #183a2a; --bad: #ff6d6d; --bad-soft: #43222a; --boss: #c79bff; --boss-soft: #2f2148;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 1080px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; line-height: 1.25; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.m i { font-family: var(--font-math); font-style: italic; font-size: 1.12em; }
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.1; margin: 0 2px; }
.frac > span:first-child { border-bottom: 2px solid currentColor; padding: 0 3px 2px; }
.frac > span:last-child { padding: 2px 3px 0; }

.btn { min-height: 48px; padding: 8px 18px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--ink); }
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--panel); }
.btn.boss { background: var(--boss); border-color: var(--boss); color: var(--panel); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; background: var(--blue-soft); color: var(--blue); font-weight: 500; white-space: nowrap; }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.chip.trap { background: var(--bad-soft); color: var(--bad); }
.chip.boss { background: var(--boss-soft); color: var(--boss); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.muted { color: var(--muted); }

/* ---------- 入口 ---------- */
.hero { padding-block: 32px 4px; display: grid; gap: 10px; }
.eyebrow { font-size: 13px; letter-spacing: .08em; color: var(--muted); }
.hero h1 { font-size: clamp(36px, 7vw, 58px); margin: 0; }
.hero h1 mark { background: linear-gradient(transparent 55%, var(--hl) 55%); color: inherit; padding: 0 4px; }
.lead { margin: 0; max-width: 38em; color: var(--muted); font-size: 17px; }
.demo-line { margin-top: 16px; background: var(--panel); border: 1.5px solid var(--ink); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 10px; max-width: 640px; }
.demo-line .eq { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 24px; }
.demo-line .cap { font-size: 14px; color: var(--muted); }
.mini-slot { display: inline-flex; min-width: 70px; min-height: 44px; border: 2px dashed var(--blue); border-radius: 10px; align-items: center; justify-content: center; padding: 0 10px; animation: pulse 2.4s ease-in-out infinite; }
.mini-card { display: inline-flex; min-height: 40px; align-items: center; padding: 0 12px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--panel); font-size: 20px; }

.twoq p { margin: 4px 0 0; color: var(--muted); }
.prompt pre { margin: 0; white-space: pre-wrap; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; font-family: var(--font-body); font-size: 15px; line-height: 1.7; overflow-x: auto; }
.credit { margin-top: 28px; font-size: 13px; color: var(--muted); }

/* ---------- 遊戲 ---------- */
.gbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); display: flex; align-items: center; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.gbar h2 { margin: 0; font-size: 22px; }
.gbar .stats { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: 14px; white-space: nowrap; }
.stat b { font-size: 17px; font-variant-numeric: tabular-nums; }
.bossbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--boss-soft); border-radius: var(--radius); padding: 10px 16px; margin-top: 12px; }
.boss-face { width: 58px; height: 58px; border-radius: 18px; background: var(--boss); color: var(--panel); display: grid; place-items: center; font-family: var(--font-math); font-style: italic; font-size: 38px; line-height: 1; }
.boss-face.hit { animation: hit .45s ease; }
.boss-face.taunt { animation: taunt .5s ease; }
@keyframes hit { 25% { transform: translateX(-6px) rotate(-8deg); filter: brightness(1.6); } 60% { transform: translateX(5px) rotate(5deg); } }
@keyframes taunt { 30% { transform: scale(1.15); } }
.hpwrap { display: grid; gap: 4px; min-width: 0; }
.hpwrap .lbl { display: flex; justify-content: space-between; font-size: 14px; }
.hp { height: 14px; border-radius: 7px; background: var(--panel); overflow: hidden; border: 1px solid var(--line); }
.hp i { display: block; height: 100%; background: var(--boss); transition: width .5s ease; }
.clock { font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.clock.low { color: var(--bad); }
.dmg { position: fixed; z-index: 30; font-family: var(--font-display); font-size: 34px; color: var(--boss); pointer-events: none; animation: rise 1s ease forwards; }
@keyframes rise { to { transform: translateY(-60px); opacity: 0; } }

.work { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; margin-top: 14px; align-items: start; }
@media (max-width: 860px) { .work { grid-template-columns: minmax(0, 1fr); } .gbar { position: static; } .gbar .stats { margin-left: 0; width: 100%; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.ptitle { font-size: 14px; color: var(--muted); }
.story { font-size: 18px; line-height: 1.75; }
.stem { font-size: 24px; }
.sys { display: flex; align-items: stretch; gap: 8px; font-size: 22px; }
.sys .brace { font-size: 64px; line-height: 1; font-weight: 200; display: flex; align-items: center; transform: scaleX(.6); }
.sys .lines { display: grid; gap: 2px; align-content: center; }
.board { display: grid; gap: 8px; }
.bline { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; padding: 8px 10px; border-radius: 12px; font-size: 21px; }
.bline .no { font-size: 12px; color: var(--muted); width: 100%; font-family: var(--font-body); }
.bline.done { background: var(--ok-soft); }
.bline.cur { border: 2px solid var(--blue); background: var(--blue-soft); }
.bline .brk { flex-basis: 100%; height: 0; }
.bline .filled-txt { font-weight: 700; }
.slot { min-width: 72px; min-height: 50px; border-radius: 10px; border: 2px dashed var(--blue); background: var(--panel); display: inline-flex; align-items: center; justify-content: center; padding: 4px 10px; font-size: 20px; cursor: pointer; transition: background .15s; }
.slot.filled { border-style: solid; border-color: var(--line); font-weight: 700; }
.slot.over { background: var(--hl); }
.slot.wrong { border-color: var(--bad); background: var(--bad-soft); }
.slot.hl { box-shadow: 0 0 0 4px var(--hl); }
.step-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.step-head b { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.goal { font-size: 17px; }
.scaffold { background: var(--paper); border-radius: 10px; padding: 8px 12px; font-size: 16px; }
.fb { border-radius: 12px; padding: 10px 14px; background: var(--blue-soft); }
.fb.bad { background: var(--bad-soft); }
.fb.ok { background: var(--ok-soft); }
.fb .kind { font-weight: 700; color: var(--bad); margin-right: 6px; }
.tray { display: flex; flex-wrap: wrap; gap: 10px; padding: 12px; border-radius: 12px; background: var(--paper); min-height: 74px; }
.card { min-height: 50px; padding: 6px 14px; border-radius: 10px; border: 1.5px solid var(--line); border-bottom-width: 4px; background: var(--panel); font-size: 20px; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; display: inline-flex; align-items: center; text-align: left; max-width: 100%; }

.ghost { position: fixed; z-index: 40; pointer-events: none; opacity: .92; transform: translate(-50%, -60%) rotate(-3deg); box-shadow: 0 10px 24px rgba(0,0,0,.18); }
.hints { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 15px; }
.hints:empty { display: none; }
.actions { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; }
.review { display: grid; gap: 10px; }
.review h3 { margin: 0; font-size: 26px; }
.rtable { width: 100%; border-collapse: collapse; font-size: 15px; }
.rtable td, .rtable th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.rtable th { color: var(--muted); font-weight: 500; font-size: 13px; }
.rtable td.n { text-align: right; font-variant-numeric: tabular-nums; }
details.kinds-d { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; }
details.kinds-d summary { cursor: pointer; padding: 10px 14px; min-height: 44px; font-weight: 500; }
details.kinds-d div { padding: 0 14px 12px; display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- 報告 ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

.bars { display: grid; gap: 8px; }
.barrow { display: grid; grid-template-columns: minmax(0, 12em) minmax(0, 1fr) 2.5em; gap: 10px; align-items: center; font-size: 15px; }
.barrow .track { height: 16px; background: var(--paper); border-radius: 4px; overflow: hidden; }
.barrow .track i { display: block; height: 100%; background: var(--bad); border-radius: 0 4px 4px 0; }
.barrow .n { text-align: right; font-variant-numeric: tabular-nums; }
.advice { background: var(--hl); color: var(--hl-ink); border-radius: 12px; padding: 12px 16px; }
.slow td { background: var(--hl); color: var(--hl-ink); }
@media (max-width: 520px) { .barrow { grid-template-columns: minmax(0, 1fr) 2.5em; } .barrow .track { grid-column: 1 / -1; grid-row: 2; } }
.who { display: inline-flex; align-items: center; gap: 8px; background: var(--panel); border: 1.5px solid var(--ink); border-radius: 12px; padding: 4px 6px 4px 12px; }
.who span { font-weight: 700; white-space: nowrap; }
.who input { min-height: 40px; width: 9em; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font: inherit; font-size: 18px; background: var(--paper); color: var(--ink); }
.who.inline { margin-top: 12px; }
details.teacher { margin-top: 34px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
details.teacher > summary { cursor: pointer; padding: 14px 16px; min-height: 52px; font-weight: 700; font-size: 17px; }
.teacher-body { padding: 0 16px 18px; display: grid; gap: 16px; }
.teacher-body .design { border-radius: 12px; }
code { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; font-size: .92em; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }

<script>
(function () {
  const { PACKS, checkStep, revealHint, stepScore, SCORING, slotIds, mulberry32 } = window.SB;
  const app = document.getElementById('app');
  const BOSS_HP = 120, BOSS_SEC = 240;
  const PLAYER_KEY = 'education-math-board:player';
  let player = '';
  try { player = localStorage.getItem(PLAYER_KEY) || ''; } catch (e) { /* 無法使用瀏覽器儲存 */ }
  function setPlayer(v) {
    player = v.trim().slice(0, 12);
    try { localStorage.setItem(PLAYER_KEY, player); } catch (e) { /* 無法使用瀏覽器儲存 */ }
    const el = document.getElementById('shot-player'); if (el) el.textContent = player || '（未填）';
  }
  function setHash(h) {
    try { history.replaceState(null, '', h ? `#${h}` : location.pathname + location.search); } catch (e) { /* 沙盒可能不允許改網址 */ }
  }

  // ---------- 小工具 ----------
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function M(s) {
    return esc(s)
      .replace(/(^|[^A-Za-z])([xy])(?![A-Za-z])/g, '$1<i>$2</i>')
      .replace(/\[frac:(\d+)\|(\d+)\]/g, '<span class="frac"><span>$1</span><span>$2</span></span>');
  }
  let timers = [];
  const clearTimers = () => { timers.forEach((t) => clearInterval(t)); timers = []; };

  // ---------- 狀態 ----------
  let S = null;
  function newSession(pack, mode) {
    S = {
      pack, mode, problemNo: 0, score: 0, streak: 0, best: 0, events: [], stepResults: [],
      boss: mode === 'boss' ? { hp: BOSS_HP, endsAt: Date.now() + BOSS_SEC * 1000, over: null } : null,
    };
    nextProblem();
  }
  function nextProblem() {
    S.problemNo++;
    S.problem = S.pack.make(Math.random);
    S.stepIdx = 0; S.done = [];
    S.results = [];
    startStep();
  }
  function startStep() {
    S.pl = {}; S.sel = null; S.errors = 0; S.hint = 0; S.fb = null; S.wrong = []; S.hl = null; S.t0 = Date.now();
  }
  const step = () => S.problem.steps[S.stepIdx];
  const cardOf = (id) => step().cards.find((c) => c.id === id);

  // ---------- 操作 ----------
  function place(slot, cardId) {
    for (const k of Object.keys(S.pl)) if (S.pl[k] === cardId) delete S.pl[k];
    S.pl[slot] = cardId; S.sel = null; S.wrong = S.wrong.filter((w) => w !== slot); S.fb = null;
  }
  function tapSlot(slot) {
    if (S.sel) place(slot, S.sel);
    else if (S.pl[slot]) { delete S.pl[slot]; S.fb = null; }
    renderPlay();
  }
  function tapCard(id) { S.sel = S.sel === id ? null : id; renderPlay(); }
  function check() {
    const st = step();
    const res = checkStep(st, S.pl);
    if (res.kind === 'incomplete') { S.fb = { t: 'info', h: res.fb }; S.wrong = res.wrong; return renderPlay(); }
    S.events.push({ pack: S.pack.id, no: S.problemNo, step: st.key, ok: res.ok, kind: res.kind, ms: Date.now() - S.t0, hint: S.hint, errorsBefore: S.errors });
    if (!res.ok) {
      S.errors++; S.streak = 0; S.wrong = res.wrong;
      const label = S.pack.kinds[res.kind] || '這一行還不成立';
      S.fb = { t: 'bad', h: `<span class="kind">${esc(label)}</span>${M(res.fb)}` };
      if (S.boss) bossAnim('taunt');
      return renderPlay();
    }
    const pts = stepScore(S.errors, S.hint);
    S.score += pts;
    if (!S.errors && !S.hint) { S.streak++; S.best = Math.max(S.best, S.streak); } else S.streak = 0;
    S.results.push({ key: st.key, pts, errors: S.errors, hint: S.hint, ms: Date.now() - S.t0 });
    S.stepResults.push({ key: st.key, first: !S.errors && !S.hint, ms: Date.now() - S.t0 });
    S.done.push({ step: st, pl: { ...S.pl } });
    if (S.boss) damage(pts);
    if (S.stepIdx + 1 < S.problem.steps.length) {
      S.stepIdx++; startStep();
      S.fb = { t: 'ok', h: `成立！+${pts} 分` };
    } else {
      S.stepIdx++;
      const clean = S.results.every((r) => !r.errors && !r.hint);
      S.bonus = clean ? SCORING.clean : 0;
      S.score += S.bonus;
      if (S.boss && S.bonus) damage(S.bonus, true);
    }
    renderPlay();
  }
  function hint() {
    if (S.hint >= 3) return;
    S.hint++;
    S.events.push({ pack: S.pack.id, no: S.problemNo, step: step().key, ok: null, kind: 'hint', level: S.hint });
    if (S.hint === 3) S.hl = revealHint(step(), S.pl);
    renderPlay();
  }

  // ---------- 魔王 ----------
  function damage(n, bonus) {
    const b = S.boss; if (!b || b.over) return;
    b.hp = Math.max(0, b.hp - n);
    bossAnim('hit');
    const face = document.querySelector('.boss-face');
    if (face) {
      const r = face.getBoundingClientRect();
      const d = document.createElement('div');
      d.className = 'dmg'; d.textContent = `−${n}${bonus ? ' 完美' : ''}`;
      d.style.left = `${r.right + 8}px`; d.style.top = `${r.top}px`;
      document.body.appendChild(d); setTimeout(() => d.remove(), 1000);
    }
    if (b.hp <= 0) { b.over = 'win'; setTimeout(() => { if (S && S.boss === b) showReport(); }, 900); }
  }
  function bossAnim(cls) {
    const f = document.querySelector('.boss-face'); if (!f) return;
    f.classList.remove('hit', 'taunt'); void f.offsetWidth; f.classList.add(cls);
  }
  function tickBoss() {
    const b = S && S.boss; if (!b || b.over) return;
    const left = Math.max(0, Math.ceil((b.endsAt - Date.now()) / 1000));
    const el = document.getElementById('clock');
    if (el) { el.textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`; el.classList.toggle('low', left <= 30); }
    if (left <= 0) { b.over = 'time'; showReport(); }
  }

  // ---------- 拖曳 ----------
  let drag = null;
  function onDown(e) {
    const c = e.target.closest('.card[data-card]');
    if (!c) return;
    drag = { id: c.dataset.card, x: e.clientX, y: e.clientY, el: c, ghost: null, over: null };
    try { c.setPointerCapture(e.pointerId); } catch (err) { /* 部分瀏覽器不支援 */ }
  }
  function onMove(e) {
    if (!drag) return;
    if (!drag.ghost) {
      if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 8) return;
      drag.ghost = drag.el.cloneNode(true);
      drag.ghost.classList.add('ghost'); drag.ghost.classList.remove('sel', 'hl');
      document.body.appendChild(drag.ghost);
    }
    drag.ghost.style.left = `${e.clientX}px`; drag.ghost.style.top = `${e.clientY}px`;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const slot = under && under.closest('.slot[data-slot]');
    if (drag.over && drag.over !== slot) drag.over.classList.remove('over');
    drag.over = slot; if (slot) slot.classList.add('over');
  }
  function onUp(e) {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.ghost) {
      d.ghost.remove();
      const under = document.elementFromPoint(e.clientX, e.clientY);
      const slot = under && under.closest('.slot[data-slot]');
      if (slot) { place(slot.dataset.slot, d.id); renderPlay(); }
      else if (d.over) d.over.classList.remove('over');
    } else tapCard(d.id);
  }
  function onCancel() { if (drag && drag.ghost) drag.ghost.remove(); drag = null; }

  // ---------- 畫面：算式行 ----------
  function lineHTML(st, pl, live) {
    const card = (id) => st.cards.find((c) => c.id === id);
    const tok = (t) => {
      if (typeof t === 'string') return `<span class="m">${M(t)}</span>`;
      if (t.br) return '<span class="brk"></span>';
      if (t.frac) return `<span class="frac"><span>${t.frac[0].map(tok).join('')}</span><span>${t.frac[1].map(tok).join('')}</span></span>`;
      const id = pl[t.slot], c = id && card(id);
      if (!live) return `<span class="m filled-txt">${M(c ? c.text : '')}</span>`;
      const cls = ['slot']; if (c) cls.push('filled'); if (S.wrong.includes(t.slot)) cls.push('wrong'); if (S.hl && S.hl.slot === t.slot) cls.push('hl');
      return `<button class="${cls.join(' ')} m" data-slot="${t.slot}" aria-label="空格${c ? '：' + esc(c.text) : ''}"><span>${c ? M(c.text) : ''}</span></button>`;
    };
    return st.line.map(tok).join('');
  }
  function stemHTML(p) {
    let h = '';
    if (p.story) h += `<div class="story">${M(p.story)}</div>`;
    if (p.stem.length === 1) h += `<div class="stem m">解方程式：${M(p.stem[0])}</div>`;
    if (p.stem.length === 2) h += `<div class="sys m"><span class="brace" aria-hidden="true">{</span><div class="lines">${p.stem.map((l) => `<div>${M(l)}</div>`).join('')}</div></div>`;
    return h;
  }

  function statsHTML() {
    if (S.boss) return `<div class="stats"><span class="stat">分數 <b>${S.score}</b></span><button class="btn" data-act="report" style="min-height:40px">結束，看紀錄</button></div>`;
    return `<div class="stats"><span class="stat">分數 <b>${S.score}</b></span><span class="stat">連續一次成立 <b>${S.streak}</b></span><span class="stat">完成 <b>${S.problemNo - (S.stepIdx < S.problem.steps.length ? 1 : 0)}</b> 題</span><button class="btn" data-act="report" style="min-height:40px">結束，看紀錄</button></div>`;

          <div class="row end"><button class="btn" data-act="report">結束，看紀錄</button><button class="btn primary" data-act="next">下一題</button></div>
        </div>`;
    }
    app.innerHTML = `
      <div class="gbar">

        <span class="muted" style="font-size:13px">每完成一步就攻擊一次；一次成立傷害最高。錯了不扣血，但這一步的傷害會變少。</span></div>
        <div class="clock" id="clock" aria-label="剩餘時間">4:00</div></div>` : ''}
      <div class="work">
        <section class="panel">

  // ---------- 報告（截圖傳給老師） ----------
  function showReport() {
    clearTimers(); setHash('');

    ev.filter((e) => !e.ok && e.kind !== 'other').forEach((e) => { kinds[e.kind] = (kinds[e.kind] || 0) + 1; });
    const other = ev.filter((e) => !e.ok && e.kind === 'other').length;
    const sr = S.stepResults;
    const first = sr.length ? Math.round((sr.filter((r) => r.first).length / sr.length) * 100) : 0;
    const hints = S.events.filter((e) => e.kind === 'hint').length;
    const solved = S.problemNo - (S.stepIdx < S.problem.steps.length ? 1 : 0);
    const byStep = {};
    sr.forEach((r) => { const s = (byStep[r.key] ||= { n: 0, first: 0, ms: 0 }); s.n++; s.first += r.first ? 1 : 0; s.ms += r.ms; });
    const stepRows = Object.entries(byStep).map(([k, s]) => ({ k, n: s.n, first: Math.round((s.first / s.n) * 100), sec: s.ms / s.n / 1000 }));
    const slowest = stepRows.reduce((a, r) => (!a || r.sec > a.sec ? r : a), null);

      : '這一局沒有出現誤解，可以挑戰下一個內容包。';

  }

          <div class="design"><table><tbody>
            <tr><th>1 教學目標</th><td>學生能依序完成去括號、移項、合併、消去、代回等步驟，並從文字題列出方程式。</td></tr>
            <tr><th>2 評量證據</th><td>學生在每一個空格放了哪張卡、第一次就成立的比例、用了幾層提示。<span>每次「檢查」都記一筆：步驟、對錯、誤解代碼、秒數。</span></td></tr>
            <tr><th>3 核心機制</th><td>把數、項、式子拖進算式的空格，組出這一步的數學關係。完成的行留在板子上，下一步引用它。</td></tr>
            <tr><th>4 誤解→誘答</th><td>每張錯卡對準一個誤解，各有一句診斷回饋。</td></tr>
            <tr><th>5 回饋與計分</th><td>每步 10 分，錯一次 −1（最多 −3），提示依層數 −2／−4／−6，每步最低 3 分；整題零錯零提示 +5。<span>分數付給「獨立完成」，不付給手速。</span></td></tr>
            <tr><th>6 鷹架</th><td>三層提示：方向 → 關鍵關係 → 標出一個空格該放哪張卡。</td></tr>
            <tr><th>7 課堂運作</th><td>例題後 15～20 分鐘獨立練習；最後 5 分鐘全班一起打魔王；學生截圖紀錄卡繳交。</td></tr>
            <tr><th>8 資料留痕</th><td>紀錄卡顯示誤解排行、各步驟首次正確率與平均秒數，以及給老師的建議。</td></tr>
          </tbody></table></div>
          <div class="twoq">
            <div><b>問題 1：拿掉數學，還玩得下去嗎？</b><p>玩不下去。沒有「這一項要不要變號、要乘多少」的判斷，就沒有任何可以拖的卡。</p></div>
            <div><b>問題 2：遊戲操作就是要評量的數學行為嗎？</b><p>是。要評量的是「建立每一步的等式」，遊戲操作正是把量放進那個等式的正確位置。</p></div>
          </div>
          <div>
            <h3 style="margin:0 0 6px;font-size:20px">直接連結到某個內容包</h3>
            <p style="margin:0">在網址最後加上 <code>#代號</code> 是練習，加上 <code>#代號-boss</code> 是魔王對戰。現有代號：${PACKS.map((p) => `<code>${esc(p.id)}</code>（${esc(p.title)}）`).join('、')}。</p>
          </div>
          <div>
            <h3 style="margin:0 0 6px;font-size:20px">做自己的內容包</h3>
            <p style="margin:0 0 8px">用 AI Agent 打開這個專案，把下面這段貼給它，填好空格。</p>
            <div class="prompt"><pre id="prompt-text">${esc(PROMPT)}</pre></div>
            <div class="row end" style="margin-top:10px"><span id="copy-note" class="muted" style="font-size:14px" aria-live="polite"></span><button class="btn primary" data-act="copy">複製提示詞</button></div>
          </div>
        </div>
      </details>
      <p class="credit">遊戲機制與設計規範參考三師爸的開源專案 <a href="https://github.com/mathruffian-dot/math-game-templates" target="_blank" rel="noopener">mathruffian-dot/math-game-templates</a>（MIT 授權）的 T3 拖拉解題板。</p>`;
    window.scrollTo(0, 0);
  }
  function start(id, mode) {
    const pk = PACKS.find((p) => p.id === id); if (!pk) return showHub();
    clearTimers();
    newSession(pk, mode);
    setHash(mode === 'boss' ? `${id}-boss` : id);
    renderPlay(); window.scrollTo(0, 0);
    if (mode === 'boss') timers.push(setInterval(tickBoss, 250));
  }

  // ---------- 事件 ----------
  app.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
  app.addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.card) return; // 卡片由 pointer 事件處理（含點選）
    if (b.dataset.go === 'hub') return showHub();
    if (b.dataset.start) return start(b.dataset.start, b.dataset.mode);
    if (b.dataset.again) return start(S.pack.id, b.dataset.again);
    if (b.dataset.slot) return tapSlot(b.dataset.slot);
    const act = b.dataset.act;
    if (act === 'check') return check();
    if (act === 'hint') return hint();
    if (act === 'clear') { S.pl = {}; S.sel = null; S.wrong = []; S.fb = null; return renderPlay(); }
    if (act === 'next') { nextProblem(); renderPlay(); return window.scrollTo(0, 0); }
    if (act === 'report') return showReport();
    if (act === 'copy') {
      const note = document.getElementById('copy-note');
      try { await navigator.clipboard.writeText(PROMPT); note.textContent = '已複製'; }
      catch (err) {
        const r = document.createRange(); r.selectNodeContents(document.getElementById('prompt-text'));
        const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        note.textContent = '已選取文字，請按複製';
      }
    }
  });
  // 鍵盤：卡片用 Enter / 空白鍵選取
  app.addEventListener('keydown', (e) => {
    const c = e.target.closest && e.target.closest('.card[data-card]');
    if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); tapCard(c.dataset.card); }
  });

  app.addEventListener('input', (e) => { if (e.target.id === 'player') setPlayer(e.target.value); });

  // 網址 #代號 直接進練習、#代號-boss 直接進魔王對戰
  function route() {
    const h = decodeURIComponent(location.hash.slice(1));
    const direct = PACKS.find((p) => p.id === h);
    const boss = !direct && h.endsWith('-boss') && PACKS.find((p) => p.id === h.slice(0, -5));
    if (direct) start(direct.id, 'practice');
    else if (boss) start(boss.id, 'boss');
    else showHub();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
